StylesPath = .github/styles
MinAlertLevel = warning

Vocab = Loft

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Loft, Google, Vale
Vale.Spelling = NO

# Ignore JSX tags in .mdx files
BlockIgnores = '(<(?!(?i:Flow|Step)\b)([a-zA-Z]+)(?:\s+[^>]*)?>)([\s\S]*?)(<\/\2>)'
BlockIgnores = 'import .*'
BlockIgnores = '(<InterpolatedCodeBlock[\s\S]*?/>)'
BlockIgnores = '(<InterpolatedCodeBlock[^>]*>[\s\S]*?</InterpolatedCodeBlock>)'
BlockIgnores = '\[.+?\]\(https?://.+?\)'

TokenIgnores = (\(#.*\)),(\]\(),(http.*),({{<\s*\/?expand),(\!\[),(\d.*px),(\d\.\d\.\d),(\S*vcluster\.com/\S+)
TokenIgnores = (?<=\[[\s\S]+?\])\([^)]+\)
Google.OxfordComma = YES
Google.Quotes = NO
Google.Spacing = NO
Google.Latin = NO
Google.Will = NO

# Auto-generated config docs have camelCase terms in frontmatter description
# fields (e.g., "statefulSet", "coredns", "rbac") that trigger Vale.Terms
# false positives. These files are regenerated by hack/vcluster/partials/.
[**/configure/vcluster-yaml/**]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# Quick-start guides contain CLI commands (vcluster create, vcluster connect,
# etc.) inside <Step> components. Vale.Terms fires on "vcluster" in code blocks
# because <Step> is intentionally excluded from BlockIgnores in this config.
[**/quick-start/**]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# Security docs reference camelCase vcluster.yaml keys (e.g., networkPolicy,
# podSecurityStandard) in inline code spans. Vale.Terms fires on these as
# false positives since they are config identifiers, not prose.
[**/security/**]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# Docker container deploy guides use the same <Flow>/<Step> pattern and contain
# vcluster CLI commands and file paths (e.g. /loft-sh/vcluster/releases/) inside
# <Step> components. Same root cause as quick-start above.
[**/deploy/control-plane/docker-container/**]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# Node provider, virtual machine, and machine management docs are spec/reference
# pages dense with Kubernetes annotation keys (e.g. kubevirt.vcluster.com/image-url,
# bcm.vcluster.com/network-name). These keys use lowercase domain components by
# spec. Vale.Terms cannot distinguish annotation key tokens from prose, and the
# TokenIgnores pattern breaks down on dotted/slashed identifiers in inline code.
[**/administer/node-providers/**]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

[platform/vmetal/drivers/bare-metal/nico.mdx]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

[**/administer/virtual-machines/**]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

[**/use-platform/machines/**]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# parameters.mdx uses annotation key examples (e.g. example.vcluster.com/timezone)
# in prose to illustrate template variable access. Same false-positive root cause.
[**/administer/templates/parameters.mdx]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# troubleshoot/stacks.mdx has a node-label key (runai.vcluster.com/tenant) inside
# an inline kubectl command in a table cell. Same false-positive root cause: the
# TokenIgnores pattern for `vcluster.com/...` doesn't reliably except it once
# other command text shares the same code span.
[**/troubleshoot/stacks.mdx]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# kube-virt.mdx names the `deploy.csi.kubeVirt.enabled` config key in prose.
# The key is camelCase by schema, so Vale.Terms reads it as a miscased "KubeVirt".
# Same false-positive root cause as the annotation-key pages above: the
# TokenIgnores pattern breaks down on dotted identifiers inside inline code.
[**/_fragments/integrations/kube-virt.mdx]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# how-does-syncing-work.mdx quotes Kubernetes field paths in prose, such as
# `spec.tls[*].secretName`. The segments are lowercase by API spec, so
# Vale.Terms reads them as miscased terms. Same root cause again.
[**/_fragments/how-does-syncing-work.mdx]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# `metrics-backend-mtls` is a literal Kubernetes Secret name (must stay
# lowercase per RFC 1123), and "Deploy Grafana" is correct sentence case with
# a proper noun that Google.Headings doesn't recognize as one. Neither needs
# to change, so scope both rules off for this page instead of the vocab (which
# would create new false positives on the "grafana" anchors and reverse-proxy
# path used throughout the fleet monitoring pages).
[**/observability/deploy-with-argocd.mdx]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO
Google.Headings = NO

# "Terminate" here always means the cloud/Kubernetes action of destroying a node or
# instance (matches the actual API names, e.g. ec2:TerminateInstances), not ending a
# session, so Google.WordList's stop/exit/cancel/end suggestion would be inaccurate.
# "GCP service account name" is a real GCP resource-name field, not a login username,
# so the account-name-to-username substitution is also a false positive. Scope the
# whole rule off for this page rather than editing the shared word list, since inline
# per-instance vale toggles proved unreliable across this page's wrapped list items
# and table cells.
[**/observability/nvsentinel-gpu-observability.mdx]
BasedOnStyles = Loft, Google, Vale
Google.WordList = NO

# Auto-generated by scripts/generate-platform-cli-index.js from
# vcluster/cli/vcluster_platform*.md. The regenerate-instructions comment
# references that file path in plain text, and command descriptions are
# copied verbatim from the CLI's own --help output. Vale.Terms fires on
# "vcluster"/"cli" in both. Do not hand-edit this file to silence Vale;
# fix the generator or the upstream CLI reference instead.
[**/_partials/reference/platform-cli-commands.mdx]
BasedOnStyles = Loft, Google, Vale
Vale.Terms = NO

# Generated reference trees. Their prose comes from upstream Go doc comments and
# the vcluster.yaml schema, and handle-source-release.yml rewrites these trees
# wholesale on every release, so an edit here is deleted by the next sync. Their
# terminology needs upstream changes in loft-sh/vcluster-pro and loft-sh/api,
# tracked separately. Without this, every release sync PR would fail the
# now error-level cluster-terminology rule on ~930 lines it cannot fix.
[{vcluster/_partials/config,vcluster/cli,platform/api}/**]
BasedOnStyles = Loft, Google, Vale
Loft.cluster-terminology = NO

# The Algolia runbook documents the synonym groups that map retired terminology
# onto the terms the docs now use, so it has to name "virtual cluster", "tenant
# cluster", "host cluster" and "multi-tenancy" to say which groups exist and what
# to smoke-test. It also links a real filename containing "vcluster". Flagging
# those is the rule working correctly on prose that is about the rule.
[algolia/**]
BasedOnStyles = Loft, Google, Vale
Loft.cluster-terminology = NO
Loft.isolation-layer = NO
Vale.Terms = NO

# Versioned docs are point-in-time snapshots of a shipped release, so they keep
# the terminology that release used. The cluster-terminology and isolation-layer
# rules would fire on any hand-edit or manual backport into an older version and
# push it toward wording that version never shipped. Turn both off here; the
# rules still apply to the unversioned trees, which is where new prose is
# written. See the "Repositioning terminology" section of CLAUDE.md.
[{platform_versioned_docs,vcluster_versioned_docs}/**]
BasedOnStyles = Loft, Google, Vale
Loft.cluster-terminology = NO
Loft.isolation-layer = NO

# Meta and instruction files are not published documentation and are not linted
# by CI, which only runs on platform/, vcluster/, and vcluster_versioned_docs/.
# They are dense with code identifiers, title-case headings, frontmatter slugs,
# and deliberate wrong-usage examples, so prose linting produces only false
# positives here. Disable all styles for them.
[{CLAUDE,AGENTS}.md]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

# CONTRIBUTING.md is a genuine contributor doc, so keep prose linting on. Its
# section headings use intentional title case, so disable only the heading rules.
[CONTRIBUTING.md]
Google.Headings = NO
Loft.imperative-headings = NO

# "etcd storage class" and "API server concurrency" are correct sentence case
# (etcd is always lowercase per its own branding; API is a correctly-cased
# acronym), but Google.Headings still flags both. Inline vale toggles around
# these headings don't suppress the rule, so scope it off for the whole page
# instead, matching the precedent in deploy-with-argocd.mdx.
[**/deploy/control-plane/sizing-and-performance.mdx]
BasedOnStyles = Loft, Google, Vale
Google.Headings = NO

# List items that lead with an inline link (e.g. "[Limit ranges](url) control
# the storage...") are misparsed as headings by Vale's markdown adapter, so
# Google.Headings and Google.HeadingPunctuation fire on ordinary list prose
# here, not real headings. The list wording is correct as written; scope both
# rules off for this page rather than rewording every bullet to dodge a
# heading-only check that doesn't apply to list content.
[**/configure/vcluster-yaml/policies/README.mdx]
BasedOnStyles = Loft, Google, Vale
Google.Headings = NO
Google.HeadingPunctuation = NO

# Numbered step headings ("## 1. Deploy the metrics backend") are
# sentence-tokenized with "1." as its own sentence, so Vale sees a heading
# ending in a period even though the heading text itself doesn't. Same
# misparse class as policies/README.mdx above; scope the rule off here too.
[**/maintenance/observability/quickstart.mdx]
BasedOnStyles = Loft, Google, Vale
Google.HeadingPunctuation = NO
