name: Lockfile pilot probe
description: Temporary fixture for DEVOPS-1683. Not a production action.
outputs:
  value:
    description: The revision executed by the runner.
    value: ${{ steps.revision.outputs.value }}
runs:
  using: composite
  steps:
    - name: Exercise a transitive dependency
      uses: loft-sh/vcluster-docs/.github/actions/lockfile-leaf@devops-1683/pin-third-party-actions
    - name: Emit fixture revision
      id: revision
      shell: bash
      run: printf 'value=A\n' >> "$GITHUB_OUTPUT"
