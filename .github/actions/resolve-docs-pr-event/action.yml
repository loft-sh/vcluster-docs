name: Resolve docs pull request event
description: Resolve current PR state from a read-only signal workflow.
inputs:
  github-token:
    description: Token with actions, contents and pull requests read access.
    required: false
    default: ${{ github.token }}
  source-workflow:
    description: Path of the read-only signal workflow.
    required: false
    default: .github/workflows/pull-request-events.yaml
  expected-base:
    description: Restrict matching to this base branch when set.
    required: false
outputs:
  eligible:
    description: Whether exactly one PR matched.
    value: ${{ steps.resolve.outputs.eligible }}
  event-json:
    description: Current synthetic pull request event.
    value: ${{ steps.resolve.outputs.event-json }}
  event-path:
    description: Path to the synthetic event file.
    value: ${{ steps.resolve.outputs.event-path }}
  node-options:
    description: Node preload for the synthetic event.
    value: ${{ steps.resolve.outputs.node-options }}
  pr-number:
    description: Pull request number.
    value: ${{ steps.resolve.outputs.pr-number }}
  body-without-comments:
    description: Current PR body without HTML comments.
    value: ${{ steps.resolve.outputs.body-without-comments }}
  follow-up-created:
    description: Whether a trusted bot already posted a follow-up.
    value: ${{ steps.resolve.outputs.follow-up-created }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
        INPUT_EXPECTED_BASE: ${{ inputs.expected-base }}
      run: python3 "${{ github.action_path }}/src/resolve.py"
