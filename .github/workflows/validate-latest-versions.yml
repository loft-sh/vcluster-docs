name: Validate LATEST_VERSIONS

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/data/latest-versions.json'
      - 'src/components/InterpolatedCodeBlock/index.js'
      - 'plugins/remark-version-tokens.js'
      - 'scripts/check-latest-versions.js'
      - '.github/workflows/validate-latest-versions.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Check LATEST_VERSIONS staleness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-latest-versions.js
