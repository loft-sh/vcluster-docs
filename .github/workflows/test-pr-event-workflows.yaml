name: Test PR event workflows

on:
  pull_request:
    paths:
      - .github/workflows/pull-request-events.yaml
      - .github/workflows/backport-docs.yml
      - .github/workflows/forwardport-docs.yml
      - .github/workflows/linear-pr-comments.yaml
      - .github/workflows/create-linear-issue.yaml
      - .github/workflows/test-pr-event-workflows.yaml
      - tests/test_pr_event_workflows.py
  push:
    branches: [main]
    paths:
      - .github/workflows/pull-request-events.yaml
      - .github/workflows/backport-docs.yml
      - .github/workflows/forwardport-docs.yml
      - .github/workflows/linear-pr-comments.yaml
      - .github/workflows/create-linear-issue.yaml
      - .github/workflows/test-pr-event-workflows.yaml
      - tests/test_pr_event_workflows.py

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --with pyyaml==6.0.3 python3 -m unittest discover -s tests -p test_pr_event_workflows.py
