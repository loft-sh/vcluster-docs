name: Backport Documentation

on:
  pull_request_target:
    types: ["labeled", "closed"]
    paths:
      - 'vcluster/**'
      - 'platform/**'

jobs:
  backport:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true ||
        (github.event.action == 'labeled' && startsWith(github.event.label.name, 'backport-v'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Backport Docusaurus Changes
        id: backport
        uses: loft-sh/docs-backport-action@v1
        with:
          github_token: ${{ secrets.GH_ACCESS_TOKEN }}

      # A conflict leaves files unchanged and the run green, and its only
      # other trace is a comment on the already-merged source PR. Alert on
      # conflicts and failures. Clean and skipped backports send nothing,
      # and ci-test-notify sends nothing while the webhook secret is unset.
      - name: Notify Slack on backport conflicts or failure
        if: failure() || steps.backport.outputs.conflicts != ''
        uses: loft-sh/github-actions/.github/actions/ci-test-notify@ci-test-notify/v1
        with:
          test-name: "${{ job.status == 'failure' && 'Docs backport' || 'Docs backport conflicts' }} for #${{ github.event.pull_request.number }}"
          status: ${{ job.status == 'failure' && 'failure' || 'warning' }}
          details: |
            Source PR: ${{ github.event.pull_request.html_url }}
            ${{ steps.backport.outputs.summary || 'See the workflow run for the error.' }}
          run-link-position: bottom
          webhook-url: ${{ secrets.DOCS_BACKPORT_SLACK_WEBHOOK_URL }}
