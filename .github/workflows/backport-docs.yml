name: Backport Documentation

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- default-branch checkout and API-validated PR identity; no contributor code executes
    workflows: ['Pull request events']
    types: [completed]

permissions: {}

jobs:
  backport:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: backport-docs-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/resolve-docs-pr-event

      - name: Resolve pull request event
        id: event
        uses: ./.github/actions/resolve-docs-pr-event # zizmor: ignore[self-repository] -- resolver comes from the explicit default-branch checkout above
        with:
          source-workflow: .github/workflows/pull-request-events.yaml
          github-token: ${{ github.token }}

      - name: Backport Docusaurus Changes
        id: backport
        if: steps.event.outputs.eligible == 'true' && fromJSON(steps.event.outputs.event-json || '{}').pull_request.merged == true
        uses: loft-sh/docs-backport-action@v1 # zizmor: ignore[unpinned-uses] -- internal rolling action tag
        env:
          NODE_OPTIONS: ${{ steps.event.outputs.node-options }}
          RESOLVED_PR_EVENT_PATH: ${{ steps.event.outputs.event-path }}
        with:
          github_token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Notify Slack on backport conflicts or failure
        if: failure() || (steps.event.outputs.eligible == 'true' && steps.backport.outputs.conflicts != '')
        uses: loft-sh/github-actions/.github/actions/ci-test-notify@ci-test-notify/v1 # zizmor: ignore[unpinned-uses] -- internal rolling action tag
        with:
          test-name: "${{ job.status == 'failure' && 'Docs backport' || 'Docs backport conflicts' }} for #${{ steps.event.outputs.pr-number || 'unresolved' }}"
          status: ${{ job.status == 'failure' && 'failure' || 'warning' }}
          details: |
            Source PR: ${{ fromJSON(steps.event.outputs.event-json || '{}').pull_request.html_url || 'Unavailable: event resolution failed.' }}
            ${{ steps.backport.outputs.summary || 'See the workflow run for the error.' }}
          run-link-position: bottom
          webhook-url: ${{ secrets.DOCS_BACKPORT_SLACK_WEBHOOK_URL }}
