name: Backport Documentation

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- read-only relay or validated metadata; no contributor code executes
    workflows: ['Pull request events']
    types: [completed]

permissions: {}

jobs:
  backport:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    concurrency:
      group: backport-docs-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Resolve pull request event
        id: event
        uses: loft-sh/github-actions/.github/actions/resolve-pr-event@resolve-pr-event/v1 # zizmor: ignore[unpinned-uses] -- internal rolling action tag
        with:
          source-workflow: .github/workflows/pull-request-events.yaml
          github-token: ${{ github.token }}

      - name: Backport Docusaurus Changes
        id: backport
        if: steps.event.outputs.eligible == 'true' && fromJSON(steps.event.outputs.event-json || '{}').pull_request.merged == true && (steps.event.outputs.action == 'closed' || (steps.event.outputs.action == 'labeled' && startsWith(steps.event.outputs.label, 'backport-v')))
        uses: loft-sh/docs-backport-action@v1 # zizmor: ignore[unpinned-uses] -- internal rolling action tag
        env:
          NODE_OPTIONS: ${{ steps.event.outputs.node-options }}
          RESOLVED_PR_EVENT_PATH: ${{ steps.event.outputs.event-path }}
        with:
          github_token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Notify Slack on backport conflicts or failure
        if: steps.event.outputs.eligible == 'true' && ((failure() && steps.backport.outcome == 'failure') || steps.backport.outputs.conflicts != '')
        uses: loft-sh/github-actions/.github/actions/ci-test-notify@ci-test-notify/v1 # zizmor: ignore[unpinned-uses] -- internal rolling action tag
        with:
          test-name: "${{ job.status == 'failure' && 'Docs backport' || 'Docs backport conflicts' }} for #${{ steps.event.outputs.pr-number }}"
          status: ${{ job.status == 'failure' && 'failure' || 'warning' }}
          details: |
            Source PR: ${{ fromJSON(steps.event.outputs.event-json).pull_request.html_url }}
            ${{ steps.backport.outputs.summary || 'See the workflow run for the error.' }}
          run-link-position: bottom
          webhook-url: ${{ secrets.DOCS_BACKPORT_SLACK_WEBHOOK_URL }}
