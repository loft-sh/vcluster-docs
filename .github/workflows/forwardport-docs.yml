name: Forwardport Documentation

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- read-only relay or validated metadata; no contributor code executes
    workflows: ['Pull request events']
    types: [completed]

permissions: {}

jobs:
  forwardport:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    concurrency:
      group: forwardport-docs-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Resolve pull request event
        id: event
        uses: loft-sh/github-actions/.github/actions/resolve-pr-event@resolve-pr-event/v1 # zizmor: ignore[unpinned-uses] -- internal rolling action tag
        with:
          source-workflow: .github/workflows/pull-request-events.yaml
          github-token: ${{ github.token }}

      - name: Forwardport Docusaurus Changes
        if: steps.event.outputs.eligible == 'true' && fromJSON(steps.event.outputs.event-json || '{}').pull_request.merged == true && (steps.event.outputs.action == 'closed' || (steps.event.outputs.action == 'labeled' && steps.event.outputs.label == 'forwardport-main'))
        uses: loft-sh/docs-forwardport-action@v1 # zizmor: ignore[unpinned-uses] -- internal rolling action tag
        env:
          NODE_OPTIONS: ${{ steps.event.outputs.node-options }}
          RESOLVED_PR_EVENT_PATH: ${{ steps.event.outputs.event-path }}
        with:
          github_token: ${{ secrets.GH_ACCESS_TOKEN }}
