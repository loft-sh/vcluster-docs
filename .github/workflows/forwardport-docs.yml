name: Forwardport Documentation

on:
  pull_request_target:
    types: ["labeled", "closed"]
    paths:
      - 'vcluster_versioned_docs/**'
      - 'platform_versioned_docs/**'

jobs:
  forwardport:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true ||
        (github.event.action == 'labeled' && github.event.label.name == 'forwardport-main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: loft-sh/docs-forwardport-action@619fdc19b11352d48b9156eef775d9ec0826dcca # main
        with:
          github_token: ${{ secrets.GH_ACCESS_TOKEN }}
