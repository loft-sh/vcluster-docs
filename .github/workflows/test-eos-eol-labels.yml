name: Test EOS/EOL label sync

# The weekly sync in check-eos-eol-labels.yml only runs on a cron, so a change
# to the supported-versions tables or the script can break it without any PR
# check failing. Run its tests, including a parse of the live partials, on
# every PR that touches either side.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/_partials/vcluster_supported_versions.mdx'
      - 'docs/_partials/platform_supported_versions.mdx'
      - 'scripts/check-eos-eol-labels.js'
      - 'tests/check-eos-eol-labels.test.js'
      - '.github/workflows/test-eos-eol-labels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Test check-eos-eol-labels
        run: npm run test:eos-eol-labels
