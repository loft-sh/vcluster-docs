name: Validate Feature Tables

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.mdx'
      - 'src/data/features.yaml'
      - 'src/data/products.yaml'
      - 'src/components/FeatureTable/**'
      - 'scripts/sync-feature-tables.js'

  workflow_dispatch:

jobs:
  validate-feature-tables:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate feature tables
        run: npm run validate-feature-tables
