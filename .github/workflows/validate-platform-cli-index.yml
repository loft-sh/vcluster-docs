name: Validate Platform CLI Index

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'vcluster/cli/vcluster_platform*.md'
      - 'platform/_partials/reference/platform-cli-commands.mdx'
      - 'scripts/generate-platform-cli-index.js'

  workflow_dispatch:

jobs:
  validate-platform-cli-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate Platform CLI index
        run: npm run validate-platform-cli-index
