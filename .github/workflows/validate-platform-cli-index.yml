name: Validate Platform CLI Index

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'vcluster/cli/vcluster_platform*.md'
      - 'platform/_partials/reference/platform-cli-commands.mdx'
      - 'scripts/generate-platform-cli-index.js'

  workflow_dispatch:

jobs:
  validate-platform-cli-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate Platform CLI index
        run: npm run validate-platform-cli-index
