name: test-preview-scripts

# The stacked PR preview logic lives in hack/preview/*.sh with bats coverage
# alongside it. The deploy workflow only runs on stacked PRs, so test the
# script here on every change to it.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'hack/preview/**'
      - '.github/workflows/stacked-pr-preview.yml'
      - '.github/workflows/test-preview-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Shellcheck preview scripts
        run: shellcheck hack/preview/*.sh

      - name: Run preview-script bats suites
        run: bats hack/preview/*.bats
