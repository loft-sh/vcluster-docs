name: Validate MDX Link Suffixes

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/**/*.mdx'
      - 'platform_versioned_docs/**/*.mdx'
      - 'vcluster/**/*.mdx'
      - 'vcluster_versioned_docs/**/*.mdx'
      - 'scripts/find-spa-broken-links.py'
      - 'scripts/validate-reusable-imports.py'

  workflow_dispatch:

jobs:
  validate-mdx-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Scan live docs for bare relative links
        run: python3 scripts/find-spa-broken-links.py

      - name: Validate reusable content imports
        run: python3 scripts/validate-reusable-imports.py

      # Only the newest versioned folder of each product is enforced, and it is
      # held to the same bar as the live tree via --enforce-reusable: the
      # newest snapshot is a copy of vcluster/ or platform/, already enforced
      # above, so a release cut cannot introduce findings. Older versions
      # predate the fix and are never edited, so they stay out of CI.
      # The latest version is picked up automatically without workflow edits.
      - name: Scan latest versioned docs for bare relative links
        run: |
          paths=()
          for tree in vcluster_versioned_docs platform_versioned_docs; do
            latest=$(ls -d "$tree"/version-* 2>/dev/null | sort -V | tail -1)
            if [ -n "$latest" ]; then
              paths+=("$latest")
            fi
          done
          if [ ${#paths[@]} -eq 0 ]; then
            echo "No versioned docs folders found" >&2
            exit 1
          fi
          echo "Scanning ${paths[*]}"
          python3 scripts/find-spa-broken-links.py --enforce-reusable "${paths[@]}"
