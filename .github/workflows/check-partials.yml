name: Check partials

# _partials/ holds generated content only, and hand-written reusable snippets
# go in _fragments/ (see "Partials vs fragments" in CLAUDE.md). This fails a PR
# that adds a new hand-written file under _partials/. Existing files, edits,
# and moves aren't flagged. All logic lives in hack/check-partials.sh, tested
# by hack/check-partials_test.sh.
#
# Break-glass: add the "partials-check-skip" label to the PR.

on:
  pull_request:
    branches: [main, next]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "vcluster/**"
      - "platform/**"
      - "docs/**"
      - "hack/check-partials.sh"
      - "hack/check-partials_test.sh"
      - ".github/workflows/check-partials.yml"

permissions:
  contents: read

jobs:
  check-partials:
    name: No hand-written files in _partials
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'partials-check-skip') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the check
        run: bash hack/check-partials_test.sh

      - name: Check for new hand-written partials
        run: bash hack/check-partials.sh
