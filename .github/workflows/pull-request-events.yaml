name: Pull request events
run-name: docs-pr-event:${{ toJSON(github.event.action) }}:${{ toJSON(github.event.label.name || '') }}

on:
  pull_request:
    types: [opened, edited, labeled, closed, reopened, synchronize]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Signal trusted consumers
        run: ':'
