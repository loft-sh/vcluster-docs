name: Create follow up linear issue

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- default-branch checkout and API-validated PR identity; no contributor code executes
    workflows: ['Pull request events']
    types: [completed]

permissions: {}

jobs:
  create-linear-issue-on-pull-request:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: create-linear-issue-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/resolve-docs-pr-event

      - name: Resolve pull request event
        id: event
        uses: ./.github/actions/resolve-docs-pr-event # zizmor: ignore[self-repository] -- resolver comes from the explicit default-branch checkout above
        with:
          source-workflow: .github/workflows/pull-request-events.yaml
          github-token: ${{ github.token }}

      - name: Create the Linear Issue
        id: createIssue
        if: steps.event.outputs.eligible == 'true' && contains(fromJSON(steps.event.outputs.event-json || '{}').pull_request.labels.*.name, 'follow-up') && steps.event.outputs.follow-up-created != 'true'
        uses: ctriolo/action-create-linear-issue@699c7c2f0639181e0eaf5622d2987c6584f48a5a # v0.7
        with:
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          linear-team-key: "DOC"
          linear-issue-title: "follow-up: ${{ fromJSON(steps.event.outputs.event-json).pull_request.title }}"
          linear-issue-description: ${{ steps.event.outputs.body-without-comments }}
          linear-attachment-url: ${{ fromJSON(steps.event.outputs.event-json).pull_request.html_url }}
          linear-attachment-title: ${{ fromJSON(steps.event.outputs.event-json).pull_request.title }}
          linear-issue-label-ids: '918eb5e1-2297-44f0-b618-ca1659cbceb7'

      - name: Create comment in PR with Linear Issue link
        if: steps.event.outputs.eligible == 'true' && steps.createIssue.outcome == 'success'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ steps.event.outputs.pr-number }}
          body: |
            <!-- docs-follow-up -->
            ${{ steps.createIssue.outputs.linear-issue-url }}
