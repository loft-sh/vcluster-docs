name: stacked-pr-preview

# Netlify builds a Deploy Preview only for PRs whose base branch it deploys:
# main, next, and the archived vcluster-v* and platform-v* branches. A stacked
# PR targets another PR's branch, so reviewers saw no rendered pages until the
# base merged, or someone with Netlify access deployed a draft by hand
# (DEVOPS-1556). This workflow builds those PRs and uploads a Netlify draft
# deploy at the fixed alias pr-<number>, then posts its URL on the PR.
# Production and branch deploys are untouched: the deploy never passes --prod.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - main
      - next
      - 'vcluster-v*'
      - 'platform-v*'

permissions:
  contents: read

concurrency:
  group: stacked-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NETLIFY_CLI_VERSION: 27.10.0
  # vcluster-docs-site. The site ID names the project and grants no access.
  NETLIFY_SITE_ID: 9cf411b1-f9fe-4ebe-b75d-e8228be7004a

jobs:
  check:
    name: Check whether Netlify previews this PR
    # Secrets are not passed to PRs from forks, so those get no preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Native GitHub stacks based on main already get a Netlify Deploy
      # Preview, which branches-ignore cannot see.
      - name: Check for a Netlify Deploy Preview
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash hack/preview/needs-stacked-preview.sh

  deploy:
    name: Deploy stacked PR preview
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # The Docusaurus build peaks around 10.6 GB; hosted runners for public
    # repos have 16 GB.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The token goes only to the steps that call Netlify, so npm ci's
      # install scripts never see it.
      - name: Check Netlify token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            echo "::error::Secret NETLIFY_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs build.command from netlify.toml with its [build.environment] and
      # the site's deploy-preview environment variables, as Netlify would.
      - name: Build site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
        run: npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" build --context deploy-preview

      - name: Deploy draft
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash hack/preview/deploy-stacked-preview.sh

      - name: Comment preview URL
        uses: loft-sh/github-actions/.github/actions/sticky-pr-comment@d462e847d4f8f4a139890264a35b68cc30472547 # sticky-pr-comment/v1
        with:
          marker: '<!-- stacked-pr-preview -->'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### <span aria-hidden="true">✅</span> Stacked PR preview for *vcluster-docs-site* ready!

            |  Name | Link |
            |:-:|------------------------|
            |<span aria-hidden="true">🔨</span> Latest commit | ${{ github.event.pull_request.head.sha }} |
            |<span aria-hidden="true">🔍</span> Latest deploy log | ${{ steps.deploy.outputs.logs }} |
            |<span aria-hidden="true">😎</span> Stacked PR preview | [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }}) |
            |<span aria-hidden="true">🌿</span> Base branch | `${{ github.event.pull_request.base.ref }}` |
            ---
            Netlify doesn't build Deploy Previews for PRs against this base, so the `stacked-pr-preview` workflow deployed this draft. It updates on every push. To see unreleased changes, put `/next/` after the product path, for example `/docs/platform/next/`. Once this PR targets `main`, use the Netlify Deploy Preview instead.
