name: Workflow lockfile pilot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lockfile-pilot.yml
      - .github/workflows/actions.lock
      - .github/actions/lockfile-*/**

permissions: {}

jobs:
  locked-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Run the locked internal action
        id: probe
        uses: loft-sh/vcluster-docs/.github/actions/lockfile-probe@devops-1683/pin-third-party-actions
      - name: Verify the locked revision survives a moved ref
        env:
          OBSERVED: ${{ steps.probe.outputs.value }}
        run: test "$OBSERVED" = A
