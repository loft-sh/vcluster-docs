---
# Isolation runs at two layers and they are not interchangeable:
#
#   tenant isolation  = the Tenant primitive boundary. One customer
#                       organization's inventory, identities and configuration
#                       separated from another's, inside the management plane.
#   cluster isolation = workload, control plane, node and network separation.
#                       Private nodes, vNode, resource proxy ownership labels.
#
# "multi-tenancy" as a lowercase descriptor is always one of the two. It
# survives only as the product and license feature name "Multi-Tenancy", which
# this rule deliberately does not match because it is case-sensitive on the
# hyphenated proper noun.
#
# Warning level, and scoped off for the Tenants docs in .vale.ini where "tenant
# isolation" is the correct term and appears often.
extends: existence
message: "'%s' is ambiguous. Use 'tenant isolation' for the Tenant boundary, or 'cluster isolation' for workload separation."
level: warning
scope: text
nonword: true
tokens:
  # Case-sensitive on purpose: "Multi-Tenancy" (capital T) is the product and
  # license feature name and must pass. "Multi-tenancy" at sentence start is the
  # descriptor, so it is matched.
  - '\bmulti-tenancy\b'
  - '\bMulti-tenancy\b'
  - '\bmultitenancy\b'
  - '\bMultitenancy\b'
  - '\bmulti-tenant isolation\b'
