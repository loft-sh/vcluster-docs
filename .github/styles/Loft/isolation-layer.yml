---
# "multi-tenancy" is retired as a descriptor in prose. Describe what the product
# does instead, for example "isolated tenants on dedicated hardware".
#
# The word also shifted meaning internally. It now refers to managing multiple
# tenants from one platform through hardware allocation and consumption policy,
# not to sharing hardware, so old prose using it usually means something the
# product no longer claims.
#
# "Multi-Tenancy" with a capital T is the licensed feature's name. It appears on
# the Platform License page and in loft-sh/plans, and must pass. This rule is
# case-sensitive on the hyphenated proper noun so that it does.
#
# Isolation itself is "tenant isolation" at every layer. There is no second
# "cluster isolation" term. Decided by product and marketing in
# #proj-multi-tenant-platform on 2026-09-23.
#
# Warning level, and scoped off for the Tenants docs in .vale.ini where "tenant
# isolation" is the correct term and appears often.
extends: existence
message: "'%s' is retired as a descriptor. Use 'tenant isolation', or describe what the product does. 'Multi-Tenancy' naming the licensed feature is exempt."
level: warning
scope: text
nonword: true
tokens:
  - '\bmulti-tenancy\b'
  - '\bMulti-tenancy\b'
  - '\bmultitenancy\b'
  - '\bMultitenancy\b'
  - '\bmulti-tenant isolation\b'
