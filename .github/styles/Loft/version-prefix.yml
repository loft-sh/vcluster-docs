# Version numbers for vCluster Labs products carry a "v" prefix in prose, as in
# vCluster v0.38, Platform v5.0, and "requires v0.24.2 or later". Third-party versions (Kubernetes,
# etcd, Helm, Go) follow their own upstream style and are out of scope. See
# "Version numbers" in .claude/skills/vcluster-docs-writer/references/style-guide.md.
#
# The rule only matches a version that follows a product name, or "version"
# followed by a 0.x number (always a vCluster-family version in these docs).
# Bare numbers such as "0.37 or later" can't be told apart from third-party
# versions or CIS control numbers, so they're left to review.
#
# Warning level, so CI flags it only on lines a PR adds (`filter_mode: added`).
# Versioned docs are scoped out in .vale.ini.
extends: existence
message: "Add a 'v' prefix to the product version number in '%s'."
level: warning
scope: text
ignorecase: false
nonword: true
tokens:
  - '\b(?:vCluster|Platform|vNode|vMetal|vCluster CLI)\s+\d+\.\d+(?:\.\d+)?'
  - '\b[Vv]ersions?\s+0\.\d+(?:\.\d+)?'
