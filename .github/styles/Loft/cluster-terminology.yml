---
# The Tenant primitive (Platform 4.13) claims the word "tenant" for the customer
# organization, so the cluster vCluster creates is now just a "cluster". See the
# "Repositioning terminology" section of CLAUDE.md for the full hierarchy.
#
# Warning rather than error on purpose. CI runs vale with `filter_mode: added`,
# so this only fires on lines a PR adds, which is the migration pressure we want
# without breaking every existing page. The large-diff fallback in
# reviewdog.yaml checks `--minAlertLevel error` only, so bulk backport PRs stay
# green. Versioned docs are scoped out in .vale.ini.
extends: substitution
message: "Use '%s' instead of '%s'."
level: warning
ignorecase: true
scope: text
swap:
  # Ordered longest-first so "host cluster" isn't shadowed by a broader match.
  tenant clusters: clusters
  tenant cluster: cluster
  virtual clusters: clusters
  virtual cluster: cluster
  host clusters: control plane clusters
  host cluster: control plane cluster
