    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="architecture-overview-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="460" fill="#FFFFFF"/>
  <text x="500" y="44" font-size="24" font-weight="700" fill="#050B24"
        text-anchor="middle">Management plane and connected clusters</text>

  <rect x="28" y="228" width="180" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="118" y="253" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Users</text>
  <text x="118" y="275" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">UI, CLI, API</text>

