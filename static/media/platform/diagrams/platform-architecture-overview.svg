<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
  <title>Management plane and connected clusters</title>
  <desc>Users reach vCluster Platform through the UI, CLI, and API. The management plane runs a web UI, an authenticating gateway, a management API serving Platform resources, controllers that reconcile them, and a backing store of custom resources. Platform reconciles that state into connected clusters, each running a Platform agent alongside the tenant cluster workloads.</desc>
