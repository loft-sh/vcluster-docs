  <text x="774" y="353" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Cluster</text>
  <text x="774" y="375" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">Namespaces, RBAC</text>

