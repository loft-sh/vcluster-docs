<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <title>Management plane and connected clusters</title>
  <desc>Users reach vCluster Platform through the UI, CLI, and API. The management plane runs a web UI, an authenticating gateway, a management API serving Platform resources, controllers that reconcile them, and a backing store of custom resources. Platform reconciles that state into connected clusters, each running a Platform agent alongside cluster workloads.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', sans-serif; }
    ]]></style>
    <marker id="architecture-overview-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#FFFFFF"/>
  <text x="450" y="44" font-size="24" font-weight="700" fill="#050B24"
        text-anchor="middle">Management plane and connected clusters</text>

  <rect x="28" y="228" width="100" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="78" y="253" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Users</text>
  <text x="78" y="275" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">UI, CLI, API</text>

  <rect x="168" y="90" width="296" height="338" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="188" y="116" font-size="16" font-weight="600" fill="#050B24">vCluster Platform</text>
  <text x="188" y="138" font-size="14" font-weight="400" fill="#696D7C">Management plane</text>

  <rect x="188" y="158" width="120" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="248" y="183" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Web UI</text>
  <text x="248" y="205" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Browser</text>

  <rect x="324" y="158" width="120" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="384" y="183" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Gateway</text>
  <text x="384" y="205" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Auth</text>

  <rect x="188" y="252" width="120" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="248" y="277" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">API</text>
  <text x="248" y="299" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Resources</text>

  <rect x="324" y="252" width="120" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="384" y="277" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Controllers</text>
  <text x="384" y="299" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Reconcile</text>

  <rect x="188" y="346" width="256" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="316" y="371" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Backing store</text>
  <text x="316" y="393" font-size="14" font-weight="400" fill="#828592"
