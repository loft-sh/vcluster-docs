        marker-end="url(#architecture-overview-arrow)"/>

  <line x1="312" y1="189" x2="320" y2="189" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#architecture-overview-arrow)"/>
  <line x1="364" y1="224" x2="268" y2="248" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#architecture-overview-arrow)"/>
  <line x1="312" y1="283" x2="320" y2="283" stroke="#B4B6BD" stroke-width="1.5"
