<svg viewBox="0 0 1024 570" xmlns="http://www.w3.org/2000/svg">
  <title>Where a provisioned instance ends up</title>
  <desc>The Platform management plane defines node providers, node types, and instances represented by NodeClaims. A connected cluster runs the provisioning components that a node provider deploys and hosts cluster control planes by default. Each provisioned instance has one of four outcomes: a worker that joins a cluster, a control plane that runs on the provisioned server rather than in the connected cluster, an independent server reached over SSH, or a node in the provider's KubeVirt cluster for one tenant's reserved VMs.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', sans-serif; }
    ]]></style>
    <marker id="machine-layer-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1024" height="570" fill="#FFFFFF"/>
  <text x="512" y="44" font-size="24" font-weight="700" fill="#050B24"
        text-anchor="middle">Where a provisioned instance ends up</text>

  <!-- Management plane -->
  <rect x="28" y="90" width="228" height="450" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="48" y="116" font-size="16" font-weight="600" fill="#050B24">vCluster Platform</text>
  <text x="48" y="138" font-size="14" font-weight="400" fill="#696D7C">Management plane</text>

  <rect x="48" y="158" width="188" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="142" y="183" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Node provider</text>
  <text x="142" y="205" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Connected cluster target</text>

  <rect x="48" y="258" width="188" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="142" y="283" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Node type</text>
  <text x="142" y="305" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Labels and defaults</text>

  <rect x="48" y="358" width="188" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="142" y="383" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Instance</text>
  <text x="142" y="405" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">A NodeClaim request</text>

  <!-- Connected cluster -->
  <rect x="296" y="90" width="272" height="450" rx="14"
        fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="316" y="116" font-size="16" font-weight="600" fill="#050B24">Connected cluster</text>
  <text x="316" y="138" font-size="14" font-weight="400" fill="#696D7C">Registered with Platform</text>

  <rect x="316" y="158" width="232" height="112" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="432" y="196" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Provisioning components</text>
  <text x="432" y="222" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">From the node provider</text>
  <text x="432" y="244" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Runs on this cluster</text>

  <rect x="316" y="308" width="232" height="112" rx="8"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="432" y="344" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Cluster</text>
  <text x="432" y="366" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">control plane</text>
  <text x="432" y="392" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">Hosted here by default</text>

  <!-- Provisioned instances -->
  <rect x="608" y="90" width="168" height="450" rx="14"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
  <text x="628" y="116" font-size="16" font-weight="600" fill="#050B24">Instances</text>
  <text x="628" y="138" font-size="14" font-weight="400" fill="#696D7C">Provisioned servers</text>

  <rect x="628" y="158" width="128" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="692" y="183" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Worker</text>
  <text x="692" y="205" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Joins a cluster</text>

  <rect x="628" y="258" width="128" height="62" rx="8"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="692" y="283" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Control plane</text>
  <text x="692" y="305" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">On the server</text>

  <rect x="628" y="358" width="128" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="692" y="383" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Independent</text>
  <text x="692" y="405" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Stays a server</text>

  <!-- Cluster membership: rows one and two only -->
  <rect x="816" y="90" width="180" height="250" rx="14"
        fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="836" y="116" font-size="16" font-weight="600" fill="#050B24">Cluster</text>
  <text x="836" y="138" font-size="14" font-weight="400" fill="#696D7C">What it joins</text>

  <rect x="836" y="158" width="140" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="906" y="183" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Worker node</text>
  <text x="906" y="205" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Runs workloads</text>

  <rect x="836" y="258" width="140" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="906" y="283" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Control plane</text>
  <text x="906" y="305" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Serves the API</text>

  <!-- The independent server stays outside cluster boundaries. -->
  <rect x="826" y="358" width="160" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="906" y="382" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">No cluster</text>
  <text x="906" y="404" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Reached over SSH</text>

  <!-- A fourth instance outcome hosts reserved VMs on the provider's cluster. -->
  <rect x="628" y="458" width="128" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="692" y="483" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">VM host</text>
  <text x="692" y="505" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Reserved VMs</text>

  <rect x="816" y="458" width="180" height="82" rx="14"
        fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="906" y="483" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">KubeVirt cluster</text>
  <text x="906" y="505" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">One tenant's VMs</text>

  <line x1="780" y1="489" x2="812" y2="489" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>

  <line x1="260" y1="265" x2="292" y2="265" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>
  <line x1="572" y1="265" x2="604" y2="265" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>

  <line x1="780" y1="189" x2="812" y2="189" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>
  <line x1="780" y1="289" x2="812" y2="289" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>
  <line x1="780" y1="389" x2="822" y2="389" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>
</svg>
