<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
  <title>From intent to tenant clusters</title>
  <desc>Admins and automation send intent to vCluster Platform through the UI, CLI, API, and GitOps. The Platform management plane holds projects and access, and templates and policies. Platform reconciles that intent into connected clusters. Each connected cluster runs the vCluster runtime and hosts many tenant clusters, drawn as a stack of cards.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="intro-overview-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="460" fill="#FFFFFF"/>
  <text x="500" y="44" font-size="24" font-weight="700" fill="#050B24"
        text-anchor="middle">From intent to tenant clusters</text>

  <rect x="28" y="229" width="220" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="138" y="254" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Admins and automation</text>
  <text x="138" y="276" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">UI, CLI, API, GitOps</text>

  <rect x="288" y="142" width="256" height="236" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="308" y="168" font-size="16" font-weight="600" fill="#050B24">vCluster Platform</text>
  <text x="308" y="190" font-size="14" font-weight="400" fill="#696D7C">Management plane</text>

  <rect x="308" y="210" width="216" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="416" y="247" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Projects and access</text>

  <rect x="308" y="296" width="216" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="416" y="333" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Templates and policies</text>

  <rect x="584" y="90" width="188" height="150" rx="14"
        fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="678" y="158" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Connected cluster</text>
  <text x="678" y="180" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">Workloads run here</text>

  <rect x="584" y="280" width="188" height="150" rx="14"
        fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="678" y="348" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Connected cluster</text>
  <text x="678" y="370" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">Workloads run here</text>

  <rect x="826" y="90" width="146" height="120" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <rect x="819" y="97" width="146" height="120" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <rect x="812" y="104" width="146" height="120" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="885" y="158" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Tenant clusters</text>
  <text x="885" y="180" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">vCluster runtime</text>

  <rect x="826" y="280" width="146" height="120" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <rect x="819" y="287" width="146" height="120" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <rect x="812" y="294" width="146" height="120" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="885" y="348" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Tenant clusters</text>
  <text x="885" y="370" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">vCluster runtime</text>

  <line x1="252" y1="260" x2="284" y2="260" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#intro-overview-arrow)"/>

  <line x1="548" y1="240" x2="580" y2="165" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#intro-overview-arrow)"/>
  <line x1="548" y1="280" x2="580" y2="355" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#intro-overview-arrow)"/>

  <line x1="776" y1="164" x2="808" y2="164" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#intro-overview-arrow)"/>
  <line x1="776" y1="354" x2="808" y2="354" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#intro-overview-arrow)"/>
</svg>
