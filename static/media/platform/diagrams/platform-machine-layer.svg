<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg">
  <title>Where a provisioned machine ends up</title>
  <desc>The Platform management plane defines node providers, node types, and Machines. A connected cluster runs the provisioning components that a node provider deploys, and hosts tenant cluster control planes by default. Each machine in the pool becomes one of three things: a worker that joins a tenant cluster, a control plane that runs on the machine itself rather than in the connected cluster, or an independently provisioned server that joins no cluster and is reached over SSH.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="machine-layer-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" fill="#FFFFFF"/>
  <text x="500" y="44" font-size="24" font-weight="700" fill="#050B24"
        text-anchor="middle">Where a provisioned machine ends up</text>

  <!-- Management plane -->
  <rect x="28" y="90" width="200" height="350" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="48" y="116" font-size="16" font-weight="600" fill="#050B24">vCluster Platform</text>
  <text x="48" y="138" font-size="14" font-weight="400" fill="#696D7C">Management plane</text>

  <rect x="48" y="158" width="160" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="128" y="183" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Node provider</text>
  <text x="128" y="205" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Targets a cluster</text>

  <rect x="48" y="258" width="160" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="128" y="283" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Node type</text>
  <text x="128" y="305" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Labels and defaults</text>

  <rect x="48" y="358" width="160" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="128" y="383" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Machine</text>
  <text x="128" y="405" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">A claim on a server</text>

  <!-- Connected cluster -->
  <rect x="268" y="90" width="272" height="350" rx="14"
        fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="288" y="116" font-size="16" font-weight="600" fill="#050B24">Connected cluster</text>
  <text x="288" y="138" font-size="14" font-weight="400" fill="#696D7C">Registered with Platform</text>

  <rect x="288" y="158" width="232" height="112" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="404" y="196" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Provisioning components</text>
  <text x="404" y="222" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">From the node provider</text>
  <text x="404" y="244" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Runs on this cluster</text>

  <rect x="288" y="308" width="232" height="112" rx="8"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="404" y="344" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Tenant cluster</text>
  <text x="404" y="366" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">control plane</text>
  <text x="404" y="392" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">Hosted here by default</text>

  <!-- Machine pool -->
  <rect x="580" y="90" width="182" height="350" rx="14"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
  <text x="600" y="116" font-size="16" font-weight="600" fill="#050B24">Machine pool</text>
  <text x="600" y="138" font-size="14" font-weight="400" fill="#696D7C">Provisioned servers</text>

  <rect x="600" y="158" width="142" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="671" y="183" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Worker</text>
  <text x="671" y="205" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Joins a cluster</text>

  <rect x="600" y="258" width="142" height="62" rx="8"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="671" y="283" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Control plane</text>
  <text x="671" y="305" font-size="14" font-weight="400" fill="#696D7C"
        text-anchor="middle">On the machine</text>

  <rect x="600" y="358" width="142" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="671" y="383" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Independent</text>
  <text x="671" y="405" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Stays a server</text>

  <!-- Tenant cluster membership: rows one and two only -->
  <rect x="802" y="90" width="170" height="250" rx="14"
        fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="822" y="116" font-size="16" font-weight="600" fill="#050B24">Tenant cluster</text>
  <text x="822" y="138" font-size="14" font-weight="400" fill="#696D7C">What it joins</text>

  <rect x="822" y="158" width="130" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="887" y="183" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Worker node</text>
  <text x="887" y="205" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Runs workloads</text>

  <rect x="822" y="258" width="130" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="887" y="283" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Control plane</text>
  <text x="887" y="305" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Serves the API</text>

  <!-- The third outcome lands outside every cluster boundary -->
  <rect x="802" y="358" width="170" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="887" y="382" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">No cluster</text>
  <text x="887" y="404" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Reached over SSH</text>

  <line x1="232" y1="265" x2="264" y2="265" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>
  <line x1="544" y1="265" x2="576" y2="265" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>

  <line x1="766" y1="189" x2="798" y2="189" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>
  <line x1="766" y1="289" x2="798" y2="289" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>
  <line x1="766" y1="389" x2="798" y2="389" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#machine-layer-arrow)"/>
</svg>
