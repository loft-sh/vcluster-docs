<svg viewBox="0 0 650 430" xmlns="http://www.w3.org/2000/svg">
  <title>API gateway request paths</title>
  <desc>Requests from the web UI, the CLI, and automation all arrive at the Platform API gateway. The gateway authenticates the caller, checks access, and impersonates them. It then forwards the request to the management API for Platform resources, to a connected cluster API for cluster-scoped requests, or to a cluster API for project-scoped requests.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', sans-serif; }
    ]]></style>
    <marker id="entry-points-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="650" height="430" fill="#FFFFFF"/>
  <text x="325" y="44" font-size="24" font-weight="700" fill="#050B24"
        text-anchor="middle">API gateway request paths</text>

  <rect x="28" y="110" width="130" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="93" y="135" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Web UI</text>
  <text x="93" y="157" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Browser</text>

  <rect x="28" y="222" width="130" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="93" y="247" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">CLI</text>
  <text x="93" y="269" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Operators</text>

  <rect x="28" y="334" width="130" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="93" y="359" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Automation</text>
  <text x="93" y="381" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Integrations</text>

  <rect x="198" y="113" width="180" height="280" rx="14"
        fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="218" y="139" font-size="16" font-weight="600" fill="#050B24">API gateway</text>

  <rect x="218" y="163" width="140" height="54" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="288" y="195" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Authenticate</text>

  <rect x="218" y="241" width="140" height="54" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="288" y="273" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Check access</text>

  <rect x="218" y="319" width="140" height="54" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="288" y="351" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Impersonate</text>

  <rect x="418" y="110" width="204" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="520" y="135" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Management API</text>
  <text x="520" y="157" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Platform resources</text>

  <rect x="418" y="222" width="204" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="520" y="247" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Connected cluster API</text>
  <text x="520" y="269" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Cluster-scoped requests</text>

  <rect x="418" y="334" width="204" height="62" rx="8"
        fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="520" y="359" font-size="16" font-weight="600" fill="#050B24"
        text-anchor="middle">Cluster API</text>
  <text x="520" y="381" font-size="14" font-weight="400" fill="#828592"
        text-anchor="middle">Project-scoped requests</text>

  <line x1="162" y1="141" x2="194" y2="190" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#entry-points-arrow)"/>
  <line x1="162" y1="253" x2="194" y2="253" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#entry-points-arrow)"/>
  <line x1="162" y1="365" x2="194" y2="316" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#entry-points-arrow)"/>

  <line x1="382" y1="190" x2="414" y2="141" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#entry-points-arrow)"/>
  <line x1="382" y1="253" x2="414" y2="253" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#entry-points-arrow)"/>
  <line x1="382" y1="316" x2="414" y2="365" stroke="#B4B6BD" stroke-width="1.5"
        marker-end="url(#entry-points-arrow)"/>
</svg>
