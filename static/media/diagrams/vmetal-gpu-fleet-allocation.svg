<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 320" width="928" height="320">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="928" height="320" fill="#ffffff"/>

  <!-- ── Section label ── -->
  <text x="464" y="20" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" letter-spacing="1.5" fill="#B4B6BD">TENANT CLUSTERS</text>

  <!-- ── Cluster A (neutral) — centered over H100 zone ── -->
  <rect x="45" y="28" width="192" height="62" rx="8"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="141" y="53" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#050B24">Cluster A</text>
  <text x="141" y="71" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">requests h100-8x nodes</text>

  <!-- ── Cluster C (neutral) ── -->
  <rect x="247" y="28" width="192" height="62" rx="8"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="343" y="53" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#050B24">Cluster C</text>
  <text x="343" y="71" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">requests h100-8x nodes</text>

  <!-- ── Cluster B (neutral) — centered over A100 zone ── -->
  <rect x="590" y="28" width="192" height="62" rx="8"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="686" y="53" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#050B24">Cluster B</text>
  <text x="686" y="71" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">requests a100-4x nodes</text>

  <!-- ── Arrows: Clusters → NodeTypes (4px tail clearance) ── -->
  <line x1="141" y1="94" x2="190" y2="142"
        stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="343" y1="94" x2="294" y2="142"
        stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="686" y1="94" x2="686" y2="142"
        stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── NodeProvider zone ── -->
  <rect x="20" y="110" width="888" height="202" rx="10"
        fill="#EDEFF3" stroke="#E6E7E9" stroke-width="1.5"/>
  <text x="464" y="128" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">NodeProvider · each server exclusively allocated to one cluster at a time</text>

  <!-- ── H100 sub-zone (vMetal teal tint) ── -->
  <rect x="35" y="136" width="414" height="166" rx="8"
        fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>

  <!-- ── A100 sub-zone (vMetal teal tint) ── -->
  <rect x="479" y="136" width="414" height="166" rx="8"
        fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>

  <!-- ── NodeType: h100-8x ── -->
  <rect x="50" y="146" width="384" height="56" rx="8" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="242" y="168" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">h100-8x</text>
  <text x="242" y="186" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#696D7C">matchLabels: gpu-model=h100 · nvidia.com/gpu: "8"</text>

  <!-- ── NodeType: a100-4x ── -->
  <rect x="494" y="146" width="384" height="56" rx="8" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="686" y="168" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">a100-4x</text>
  <text x="686" y="186" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#696D7C">matchLabels: gpu-model=a100 · nvidia.com/gpu: "4"</text>

  <!-- ── Bare Metal Host labels (one per sub-zone) ── -->
  <text x="242" y="222" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" letter-spacing="1.5" fill="#696D7C">BARE METAL HOST</text>
  <text x="686" y="222" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" letter-spacing="1.5" fill="#696D7C">BARE METAL HOST</text>

  <!-- ── H100 Servers ── -->

  <!-- server-01: allocated (Cluster A) -->
  <rect x="50" y="230" width="120" height="62" rx="6"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="110" y="253" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#050B24">server-01</text>
  <text x="110" y="269" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">→ Cluster A</text>

  <!-- server-02: allocated (Cluster C) -->
  <rect x="182" y="230" width="120" height="62" rx="6"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="242" y="253" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#050B24">server-02</text>
  <text x="242" y="269" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">→ Cluster C</text>

  <!-- server-03: available -->
  <rect x="314" y="230" width="120" height="62" rx="6"
        fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="374" y="253" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#050B24">server-03</text>
  <text x="374" y="269" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">available</text>

  <!-- ── A100 Servers ── -->

  <!-- server-04: allocated (Cluster B) -->
  <rect x="494" y="230" width="120" height="62" rx="6"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="554" y="253" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#050B24">server-04</text>
  <text x="554" y="269" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">→ Cluster B</text>

  <!-- server-05: allocated (Cluster B) -->
  <rect x="626" y="230" width="120" height="62" rx="6"
        fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="686" y="253" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#050B24">server-05</text>
  <text x="686" y="269" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">→ Cluster B</text>

  <!-- server-06: available -->
  <rect x="758" y="230" width="120" height="62" rx="6"
        fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="818" y="253" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#050B24">server-06</text>
  <text x="818" y="269" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" fill="#828592">available</text>
</svg>
