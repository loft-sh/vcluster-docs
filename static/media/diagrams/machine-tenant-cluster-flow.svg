<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="800" height="730">
  <title>How a Machine reaches a tenant cluster</title>
  <desc>A tenant cluster requests capacity through Private Nodes or Auto Nodes, creating a NodeClaim. The platform selects an eligible server through the matching machine type, the driver provisions the server, the server joins the tenant cluster as a Kubernetes node, and only then does the Machine reach Ready.</desc>
  <defs>
    <marker id="machine-tenant-flow-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="800" height="730" fill="#ffffff"/>

  <!-- Tenant cluster request -->
  <rect x="110" y="35" width="580" height="80" rx="10" fill="#FFF0E6" stroke="#FF6600" stroke-width="1.5"/>
  <text x="400" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">
    <tspan x="400">Tenant cluster requests capacity</tspan>
    <tspan x="400" dy="25" font-size="14" font-weight="400">Private Nodes or Auto Nodes</tspan>
  </text>

  <!-- NodeClaim -->
  <rect x="110" y="155" width="580" height="70" rx="10" fill="#FFF0E6" stroke="#FF6600" stroke-width="1.5"/>
  <text x="400" y="196" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">NodeClaim created</text>

  <!-- Server selection -->
  <rect x="110" y="265" width="580" height="80" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="400" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">
    <tspan x="400">Platform selects an eligible server</tspan>
    <tspan x="400" dy="25" font-size="14" font-weight="400">through the matching machine type</tspan>
  </text>

  <!-- Driver provisioning -->
  <rect x="110" y="385" width="580" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="400" y="426" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">Driver provisions the server</text>

  <!-- Kubernetes node -->
  <rect x="110" y="495" width="580" height="80" rx="10" fill="#E8ECFD" stroke="#1846ED" stroke-width="1.5"/>
  <text x="400" y="528" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">
    <tspan x="400">Joins the tenant cluster</tspan>
    <tspan x="400" dy="25" font-size="14" font-weight="400">as a Kubernetes node</tspan>
  </text>

  <!-- Machine ready -->
  <rect x="110" y="615" width="580" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="400" y="656" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">Machine ready</text>

  <!-- Flow arrows -->
  <line x1="400" y1="119" x2="400" y2="151" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-tenant-flow-arrow)"/>
  <line x1="400" y1="229" x2="400" y2="261" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-tenant-flow-arrow)"/>
  <line x1="400" y1="349" x2="400" y2="381" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-tenant-flow-arrow)"/>
  <line x1="400" y1="459" x2="400" y2="491" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-tenant-flow-arrow)"/>
  <line x1="400" y1="579" x2="400" y2="611" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-tenant-flow-arrow)"/>
</svg>
