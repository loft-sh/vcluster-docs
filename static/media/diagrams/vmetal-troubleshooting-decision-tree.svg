<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 560" width="1380" height="560">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="1380" height="560" fill="#ffffff"/>

  <!-- Column separators -->
  <line x1="450" y1="30" x2="450" y2="530" stroke="#E6E7E9" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="910" y1="30" x2="910" y2="530" stroke="#E6E7E9" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ══════════════════════════════════════ -->
  <!-- COLUMN 1: REGISTERING                 -->
  <!-- ══════════════════════════════════════ -->

  <!-- Header — vMetal teal -->
  <rect x="20" y="38" width="410" height="48" rx="8" fill="#E6F8FB" stroke="#00B7D6" stroke-width="2"/>
  <text x="225" y="57" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">server stuck at</text>
  <text x="225" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">registering</text>

  <!-- Step 1 -->
  <rect x="20" y="108" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="225" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">1  Check BMO logs</text>
  <text x="225" y="152" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">kubectl describe bmh · look for last error event</text>
  <line x1="225" y1="176" x2="225" y2="194" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="20" y="198" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="225" y="222" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">2  BMC address reachable?</text>
  <text x="225" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">ping · curl from a node in the control plane cluster</text>
  <line x1="225" y1="266" x2="225" y2="284" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="20" y="288" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="225" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">3  Check firewall rules</text>
  <text x="225" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">port 623 (IPMI) · port 443 (Redfish) must reach BMC</text>
  <line x1="225" y1="356" x2="225" y2="374" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="20" y="378" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="225" y="402" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">4  Verify credentials Secret</text>
  <text x="225" y="422" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">secretName and namespace in BareMetalHost spec</text>
  <line x1="225" y1="446" x2="225" y2="464" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Resolution — neutral gray -->
  <rect x="20" y="468" width="410" height="52" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="225" y="490" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">Fix and return BareMetalHost</text>
  <text x="225" y="508" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">set status back to available</text>

  <!-- ══════════════════════════════════════ -->
  <!-- COLUMN 2: INSPECTING                  -->
  <!-- ══════════════════════════════════════ -->

  <!-- Header — vMetal teal -->
  <rect x="480" y="38" width="410" height="48" rx="8" fill="#E6F8FB" stroke="#00B7D6" stroke-width="2"/>
  <text x="685" y="57" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">server stuck at</text>
  <text x="685" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">inspecting</text>

  <!-- Step 1 -->
  <rect x="480" y="108" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="685" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">1  Check BMC console</text>
  <text x="685" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">server powering on? network boot visible?</text>
  <text x="685" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">stalls at PXE?</text>
  <line x1="685" y1="176" x2="685" y2="194" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="480" y="198" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="685" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">2  Check DHCP server logs</text>
  <text x="685" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">no entries for MAC?</text>
  <text x="685" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">→ verify Multus / hostNetwork config</text>
  <line x1="685" y1="266" x2="685" y2="284" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="480" y="288" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="685" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">3  Check IPA ramdisk logs</text>
  <text x="685" y="326" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">no logs? server never contacted Ironic ·</text>
  <text x="685" y="342" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">check bootMACAddress</text>
  <line x1="685" y1="356" x2="685" y2="374" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="480" y="378" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="685" y="402" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">4  Check Ironic logs</text>
  <text x="685" y="422" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">look for MAC address or IPMI errors</text>
  <line x1="685" y1="446" x2="685" y2="464" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5 (catch-all, dashed) -->
  <rect x="480" y="468" width="410" height="52" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="685" y="490" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">Other: ramdisk-downloader failed</text>
  <text x="685" y="508" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">check init container logs · ramdisk image pull issue</text>

  <!-- ══════════════════════════════════════ -->
  <!-- COLUMN 3: PROVISIONING                -->
  <!-- ══════════════════════════════════════ -->

  <!-- Header — vMetal teal -->
  <rect x="940" y="38" width="410" height="48" rx="8" fill="#E6F8FB" stroke="#00B7D6" stroke-width="2"/>
  <text x="1145" y="57" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">server stuck at</text>
  <text x="1145" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">provisioning</text>

  <!-- Step 1 -->
  <rect x="940" y="108" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="1145" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">1  Check Ironic logs</text>
  <text x="1145" y="152" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">kubectl logs -n vmetal deploy/ironic</text>
  <line x1="1145" y1="176" x2="1145" y2="194" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="940" y="198" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="1145" y="222" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">2  Image URL unreachable?</text>
  <text x="1145" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">curl image URL from a debug pod in the cluster</text>
  <line x1="1145" y1="266" x2="1145" y2="284" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="940" y="288" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="1145" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">3  Checksum mismatch?</text>
  <text x="1145" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">recheck spec.image.checksum in BareMetalHost</text>
  <line x1="1145" y1="356" x2="1145" y2="374" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="940" y="378" width="410" height="64" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="1145" y="402" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">4  Wrong rootDeviceHints?</text>
  <text x="1145" y="422" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">verify spec.rootDeviceHints matches target disk</text>
  <line x1="1145" y1="446" x2="1145" y2="464" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Resolution — neutral gray -->
  <rect x="940" y="468" width="410" height="52" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="1145" y="490" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#050B24">Force re-provision</text>
  <text x="1145" y="508" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">delete Machine via UI or API</text>
</svg>
