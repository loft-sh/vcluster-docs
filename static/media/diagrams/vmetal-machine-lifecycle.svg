<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="1200" height="490" fill="#ffffff"/>

  <!-- ── Left column: provisioning (steps 1–4) ── -->

  <!-- Step 1: Cluster requests node — teal tint -->
  <rect x="40" y="40" width="520" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="300" y="81" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">Cluster requests node</text>

  <!-- Step 1 → 2: exit y=114, enter y=148 -->
  <line x1="300" y1="114" x2="300" y2="148" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Machine claims BareMetalHost — teal tint -->
  <rect x="40" y="152" width="520" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="300" y="193" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">Machine claims BareMetalHost</text>

  <!-- Step 2 → 3: exit y=226, enter y=260 -->
  <line x1="300" y1="226" x2="300" y2="260" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: PXE boot and OS install — teal tint -->
  <rect x="40" y="264" width="520" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="300" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">PXE boot and OS install</text>

  <!-- Step 3 → 4: exit y=338, enter y=372 -->
  <line x1="300" y1="338" x2="300" y2="372" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: Node joins tenant cluster — orange tint -->
  <rect x="40" y="376" width="520" height="70" rx="10" fill="#FFF0E6" stroke="#FF6600" stroke-width="1.5"/>
  <text x="300" y="417" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">Node joins tenant cluster</text>

  <!-- ── U-turn connector: step 4 right edge → step 5 left edge (neutral dashed) ── -->
  <!-- Exit step 4 right (x=560) at y=411 with 4px clearance → x=564 -->
  <!-- Enter step 5 left (x=640) at y=75 with 4px clearance → x=636 -->
  <path d="M 564 411 H 598 V 75 H 636"
        stroke="#B4B6BD" stroke-width="1.5" fill="none" stroke-dasharray="6,3"
        marker-end="url(#arr)"/>
  <!-- White rect masks the arrow line behind the rotated label -->
  <!-- Rotated text screen extent: x≈588–602, y≈123–363; add ≥5px h-pad, ≥4px v-pad -->
  <rect x="583" y="119" width="24" height="248" fill="#ffffff"/>
  <!-- Rotated label in gap — 14px minimum -->
  <text transform="rotate(-90,598,243)" x="598" y="247"
        text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#050B24">on scale-down or cluster delete</text>

  <!-- ── Right column: deprovisioning (steps 5–7) ── -->

  <!-- Step 5: Machine deleted — neutral -->
  <rect x="640" y="40" width="520" height="70" rx="10" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="900" y="81" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">Machine deleted</text>

  <!-- Step 5 → 6: exit y=114, enter y=148 -->
  <line x1="900" y1="114" x2="900" y2="148" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 6: BareMetalHost cleaned — neutral -->
  <rect x="640" y="152" width="520" height="70" rx="10" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="900" y="193" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">BareMetalHost cleaned</text>

  <!-- Step 6 → 7: exit y=226, enter y=260 -->
  <line x1="900" y1="226" x2="900" y2="260" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 7: Returned to available pool — teal tint -->
  <rect x="640" y="264" width="520" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="900" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#050B24">Returned to available pool</text>
</svg>
