<svg viewBox="0 0 1200 716" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="product-suite-title product-suite-desc">
  <title id="product-suite-title">How vCluster and vMetal fit together</title>
  <desc id="product-suite-desc">Tenant clusters and vCluster Platform combine as vCluster. vCluster consumes physical and virtual Machines from vMetal through a stable Machine API. vMetal connects to infrastructure through bare-metal, virtual-machine, and network integrations.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { font-size: 19px; font-weight: 700; fill: #050B24; }
      .section { font-size: 16px; font-weight: 700; fill: #050B24; }
      .label { font-size: 14px; font-weight: 700; fill: #050B24; }
      .body { font-size: 14px; font-weight: 500; fill: #696D7C; }
      .small { font-size: 14px; font-weight: 500; fill: #828592; }
      .boundary { font-size: 14px; font-weight: 700; letter-spacing: .3px; fill: #050B24; }
    </style>
  </defs>

  <rect width="1200" height="716" rx="18" fill="#FFFFFF"/>

  <!-- vCluster product boundary -->
  <rect x="12" y="8" width="1176" height="344" rx="20" fill="none" stroke="#FF6600" stroke-width="2"/>
  <text x="46" y="40" class="heading">vCluster</text>

  <!-- Tenant clusters -->
  <rect x="24" y="60" width="1152" height="122" rx="16" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="46" y="91" class="section">Tenant Clusters</text>
  <text x="1154" y="91" class="small" fill="#696D7C" text-anchor="end">Tenant-facing services</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="108" width="194" height="52" rx="9"/>
    <rect x="260" y="108" width="194" height="52" rx="9"/>
    <rect x="474" y="108" width="194" height="52" rx="9"/>
    <rect x="688" y="108" width="194" height="52" rx="9"/>
    <rect x="902" y="108" width="252" height="52" rx="9"/>
  </g>
  <g class="label" text-anchor="middle" dominant-baseline="middle">
    <text x="143" y="134">Kubernetes</text>
    <text x="357" y="134">Slurm</text>
    <text x="571" y="134">Inference</text>
    <text x="785" y="134">Ray</text>
    <text x="1028" y="134">Other cluster products</text>
  </g>

  <!-- Platform governance -->
  <rect x="24" y="212" width="1152" height="128" rx="16" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="46" y="244" class="section">vCluster Platform</text>
  <text x="202" y="244" class="body">Governance and tenant management</text>
  <text x="1154" y="244" class="small" fill="#696D7C" text-anchor="end">Availability varies by version and plan</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="264" width="166" height="50" rx="8"/>
    <rect x="230" y="264" width="166" height="50" rx="8"/>
    <rect x="414" y="264" width="166" height="50" rx="8"/>
    <rect x="598" y="264" width="166" height="50" rx="8"/>
    <rect x="782" y="264" width="166" height="50" rx="8"/>
    <rect x="966" y="264" width="188" height="50" rx="8"/>
  </g>
  <g class="label" text-anchor="middle" dominant-baseline="middle">
    <text x="129" y="289">Templates</text>
    <text x="313" y="289">Projects and access</text>
    <text x="497" y="289">Capacity</text>
    <text x="681" y="289">Policy</text>
    <text x="865" y="289">Observability</text>
    <text x="1060" y="289">Billing</text>
  </g>

  <!-- Stable contract between cluster consumption and infrastructure -->
  <rect x="316" y="370" width="568" height="48" rx="24" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="2"/>
  <text x="600" y="399" font-size="15" font-weight="700" fill="#050B24" text-anchor="middle">Stable Machine API</text>

  <!-- vMetal Machine layer -->
  <rect x="24" y="446" width="1152" height="200" rx="16" fill="#E6F8FB" stroke="#00B7D6" stroke-width="2"/>
  <text x="46" y="478" class="section">vMetal</text>
  <text x="111" y="478" class="body">Physical and virtual Machine provisioning and lifecycle</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="496" width="430" height="50" rx="8"/>
    <rect x="494" y="496" width="430" height="50" rx="8"/>
    <rect x="942" y="496" width="212" height="50" rx="8"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="261" y="527">Physical Machines</text>
    <text x="709" y="527">Virtual Machines</text>
  </g>
  <g class="label" text-anchor="middle">
    <text x="1048" y="514">Request · provision</text>
    <text x="1048" y="532">join · destroy</text>
  </g>

  <line x1="46" y1="572" x2="1154" y2="572" stroke="#00B7D6" stroke-width="1" stroke-dasharray="2 5"/>
  <rect x="440" y="557" width="320" height="30" rx="15" fill="#E6F8FB"/>
  <text x="600" y="577" class="boundary" text-anchor="middle">INFRASTRUCTURE DRIVER BOUNDARY</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="594" width="350" height="32" rx="7"/>
    <rect x="425" y="594" width="350" height="32" rx="7"/>
    <rect x="804" y="594" width="350" height="32" rx="7"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="221" y="615">Bare-metal drivers</text>
    <text x="600" y="615">Virtual-machine drivers</text>
    <text x="979" y="615">Network integrations</text>
  </g>

  <!-- Customer-owned infrastructure -->
  <rect x="24" y="670" width="1152" height="32" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
  <text x="600" y="690" font-size="14" font-weight="700" fill="#050B24" text-anchor="middle">YOUR INFRASTRUCTURE · SERVERS · NETWORKING · STORAGE</text>

</svg>
