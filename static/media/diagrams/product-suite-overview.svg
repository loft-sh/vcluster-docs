<svg viewBox="0 0 1200 818" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="product-suite-title product-suite-desc">
  <title id="product-suite-title">How vCluster, Platform, vMetal, and vNode fit together</title>
  <desc id="product-suite-desc">Cluster products sit above vCluster Platform governance and the vCluster tenant-cluster runtime. vNode optionally isolates workloads. vCluster consumes physical and virtual Machines from vMetal through a stable Machine API. vMetal connects to infrastructure through bare-metal, virtual-machine, and network integrations.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { font-size: 19px; font-weight: 700; fill: #050B24; }
      .section { font-size: 16px; font-weight: 700; fill: #050B24; }
      .label { font-size: 14px; font-weight: 700; fill: #050B24; }
      .body { font-size: 14px; font-weight: 500; fill: #696D7C; }
      .small { font-size: 14px; font-weight: 500; fill: #828592; }
      .boundary { font-size: 14px; font-weight: 700; letter-spacing: .3px; fill: #050B24; }
    </style>
  </defs>

  <rect width="1200" height="818" rx="18" fill="#FFFFFF"/>

  <!-- Example cluster products -->
  <rect x="24" y="20" width="1152" height="122" rx="16" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="46" y="51" class="section">Example cluster products</text>
  <text x="1154" y="51" class="small" fill="#696D7C" text-anchor="end">Tenant-facing services</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="68" width="194" height="52" rx="9"/>
    <rect x="260" y="68" width="194" height="52" rx="9"/>
    <rect x="474" y="68" width="194" height="52" rx="9"/>
    <rect x="688" y="68" width="194" height="52" rx="9"/>
    <rect x="902" y="68" width="252" height="52" rx="9"/>
  </g>
  <g class="label" text-anchor="middle" dominant-baseline="middle">
    <text x="143" y="94">Kubernetes</text>
    <text x="357" y="94">Slurm</text>
    <text x="571" y="94">Inference</text>
    <text x="785" y="94">Ray</text>
    <text x="1028" y="94">Other cluster products</text>
  </g>

  <!-- Platform governance -->
  <rect x="24" y="172" width="1152" height="128" rx="16" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="46" y="204" class="section">vCluster Platform</text>
  <text x="202" y="204" class="body">Governance and tenant management</text>
  <text x="1154" y="204" class="small" fill="#696D7C" text-anchor="end">Availability varies by version and plan</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="224" width="166" height="50" rx="8"/>
    <rect x="230" y="224" width="166" height="50" rx="8"/>
    <rect x="414" y="224" width="166" height="50" rx="8"/>
    <rect x="598" y="224" width="166" height="50" rx="8"/>
    <rect x="782" y="224" width="166" height="50" rx="8"/>
    <rect x="966" y="224" width="188" height="50" rx="8"/>
  </g>
  <g class="label" text-anchor="middle" dominant-baseline="middle">
    <text x="129" y="249">Templates</text>
    <text x="313" y="249">Projects and access</text>
    <text x="497" y="249">Capacity</text>
    <text x="681" y="249">Policy</text>
    <text x="865" y="249">Observability</text>
    <text x="1060" y="249">Billing</text>
  </g>

  <!-- Tenant-cluster runtime and optional workload isolation -->
  <rect x="24" y="330" width="850" height="112" rx="16" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="46" y="363" class="section">vCluster</text>
  <text x="130" y="363" class="body">Tenant-cluster runtime and Machine consumption</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="382" width="244" height="38" rx="8"/>
    <rect x="308" y="382" width="244" height="38" rx="8"/>
    <rect x="570" y="382" width="282" height="38" rx="8"/>
  </g>
  <g class="label" text-anchor="middle" dominant-baseline="middle">
    <text x="168" y="401">Dedicated Kubernetes API</text>
    <text x="430" y="401">Shared or private nodes</text>
    <text x="711" y="401">Automatic capacity with Auto Nodes</text>
  </g>

  <rect x="900" y="330" width="276" height="112" rx="16" fill="#E7E6FF" stroke="#0C00FF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="922" y="344" width="100" height="28" rx="14" fill="#FFFFFF" stroke="#0C00FF" stroke-width="1.5"/>
  <text x="972" y="363" font-size="14" font-weight="700" fill="#0C00FF" text-anchor="middle">OPTIONAL</text>
  <text x="1018" y="399" class="section" text-anchor="middle">vNode</text>
  <text x="1038" y="421" class="body" text-anchor="middle">Workload runtime isolation</text>

  <line x1="874" y1="386" x2="898" y2="386" stroke="#B4B6BD" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Stable contract between cluster consumption and infrastructure -->
  <rect x="316" y="472" width="568" height="48" rx="24" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="2"/>
  <text x="600" y="501" font-size="15" font-weight="700" fill="#050B24" text-anchor="middle">Stable Machine API</text>

  <!-- vMetal Machine layer -->
  <rect x="24" y="548" width="1152" height="200" rx="16" fill="#E6F8FB" stroke="#00B7D6" stroke-width="2"/>
  <text x="46" y="580" class="section">vMetal</text>
  <text x="111" y="580" class="body">Physical and virtual Machine provisioning and lifecycle</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="598" width="430" height="50" rx="8"/>
    <rect x="494" y="598" width="430" height="50" rx="8"/>
    <rect x="942" y="598" width="212" height="50" rx="8"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="261" y="629">Physical Machines</text>
    <text x="709" y="629">Virtual Machines</text>
  </g>
  <g class="label" text-anchor="middle">
    <text x="1048" y="616">Request · provision</text>
    <text x="1048" y="634">operate · reclaim</text>
  </g>

  <line x1="46" y1="674" x2="1154" y2="674" stroke="#00B7D6" stroke-width="1" stroke-dasharray="2 5"/>
  <rect x="440" y="659" width="320" height="30" rx="15" fill="#E6F8FB"/>
  <text x="600" y="679" class="boundary" text-anchor="middle">INFRASTRUCTURE DRIVER BOUNDARY</text>

  <g fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5">
    <rect x="46" y="696" width="350" height="32" rx="7"/>
    <rect x="425" y="696" width="350" height="32" rx="7"/>
    <rect x="804" y="696" width="350" height="32" rx="7"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="221" y="717">Bare-metal drivers</text>
    <text x="600" y="717">Virtual-machine drivers</text>
    <text x="979" y="717">Network integrations</text>
  </g>

  <!-- Customer-owned infrastructure -->
  <rect x="24" y="772" width="1152" height="32" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
  <text x="600" y="792" font-size="14" font-weight="700" fill="#050B24" text-anchor="middle">YOUR INFRASTRUCTURE · SERVERS · NETWORKING · STORAGE</text>

</svg>
