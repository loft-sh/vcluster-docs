<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 666" width="1400" height="666">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="1400" height="666" fill="#ffffff"/>

  <!-- ════════════════════════════════════════════════════════════
       Control Plane Cluster — K8s blue zone
       4 equal boxes (w=305) with 20px side padding + 20px gaps
       filling x=40..1360, height=128 (equal 14px top/bottom padding)
       ════════════════════════════════════════════════════════════ -->
  <rect x="40" y="40" width="1320" height="128" rx="12" fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="62" y="70" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">Control Plane Cluster</text>

  <!-- Ironic — x=60 -->
  <rect x="60" y="86" width="305" height="68" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="212" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">Ironic</text>
  <text x="212" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">BMC control · image serving</text>

  <!-- Metal3 / vMetal — x=385 -->
  <rect x="385" y="86" width="305" height="68" rx="8" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="537" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">Metal3 / vMetal</text>
  <text x="537" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">bare metal operator + NodeProvider</text>

  <!-- DHCP Proxy Pod — x=710 -->
  <rect x="710" y="86" width="305" height="68" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="862" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">DHCP Proxy Pod</text>
  <text x="862" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">PXE DHCP + HTTP proxy · Multus CNI</text>

  <!-- vCluster Platform — x=1035 -->
  <rect x="1035" y="86" width="305" height="68" rx="8" fill="#FFF0E6" stroke="#FF6600" stroke-width="1.5"/>
  <text x="1187" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">vCluster Platform</text>
  <text x="1187" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">tenant cluster management</text>

  <!-- ════════════════════════════════════════════════════════════
       Arrows CPC → network zones
       Elbow at y=258; labels to right or left of their vertical at y=238
       "Redfish/IPMI" stays right; "Multus"+"Kubernetes" move LEFT
       ════════════════════════════════════════════════════════════ -->

  <!-- Ironic (cx=212) → BMC Network (zone cx=240) -->
  <path d="M 212 158 V 258 H 240 V 274"
        stroke="#B4B6BD" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <!-- Label RIGHT of x=212 vertical -->
  <text x="219" y="238" font-family="Inter, sans-serif" font-size="14" fill="#050B24">Redfish / IPMI</text>

  <!-- DHCP Proxy Pod (cx=862) → Provisioning / DHCP proxy VIP (zone cx=660) -->
  <path d="M 862 158 V 258 H 660 V 344"
        stroke="#B4B6BD" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <!-- Label LEFT of x=862 vertical — closer to DHCP Proxy Pod -->
  <text x="855" y="238" text-anchor="end" font-family="Inter, sans-serif" font-size="14" fill="#050B24">Multus 2nd interface</text>

  <!-- vCluster Platform (cx=1187) → Tenant Network (zone cx=1160) -->
  <path d="M 1187 158 V 258 H 1160 V 274"
        stroke="#B4B6BD" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <!-- Label LEFT of x=1187 vertical — closer to vCluster Platform -->
  <text x="1180" y="238" text-anchor="end" font-family="Inter, sans-serif" font-size="14" fill="#050B24">Kubernetes API</text>

  <!-- ════════════════════════════════════════════════════════════
       Three network zones — equal width (400px)
       BMC x=40, Prov x=460, Tenant x=960
       Gaps: 20px (BMC→Prov), 100px (Prov→Tenant) — room for "joins cluster"
       All height=364 (tallest zone, sibling consistency)
       Child boxes stacked vertically, full inner width (360px)
       ════════════════════════════════════════════════════════════ -->

  <!-- BMC Network — x=40, w=400, h=364 -->
  <rect x="40" y="278" width="400" height="364" rx="12" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
  <text x="62" y="308" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">BMC Network</text>
  <text x="62" y="328" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">out-of-band management</text>

  <!-- BMC endpoint server-1 — x=60, w=360, evenly spaced to fill zone -->
  <rect x="60" y="348" width="360" height="58" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="240" y="373" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">BMC endpoint</text>
  <text x="240" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">server-1</text>

  <!-- BMC endpoint server-2 — y=422 (16px gap) -->
  <rect x="60" y="422" width="360" height="58" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="240" y="447" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">BMC endpoint</text>
  <text x="240" y="466" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">server-2</text>

  <!-- BMC endpoint server-3 — y=496 (16px gap) -->
  <rect x="60" y="496" width="360" height="58" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="240" y="521" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">BMC endpoint</text>
  <text x="240" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">server-3</text>

  <!-- Provisioning Network — x=460, w=400, h=364 -->
  <rect x="460" y="278" width="400" height="364" rx="12" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
  <text x="482" y="308" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">Provisioning Network</text>
  <text x="482" y="328" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">PXE boot traffic</text>

  <!-- DHCP proxy VIP — full inner width (x=480, w=360) -->
  <rect x="480" y="348" width="360" height="52" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="660" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">DHCP proxy VIP</text>
  <text x="660" y="389" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">static IP · provisioning subnet</text>

  <!-- Bare metal server-1 — y=416 (16px gap after VIP) -->
  <rect x="480" y="416" width="360" height="58" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="660" y="441" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">bare metal server</text>
  <text x="660" y="460" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">server-1 · PXE booting</text>

  <!-- Bare metal server-2 — y=490 (16px gap) -->
  <rect x="480" y="490" width="360" height="58" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="660" y="515" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">bare metal server</text>
  <text x="660" y="534" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">server-2 · PXE booting</text>

  <!-- Bare metal server-3 — y=564 (16px gap) -->
  <rect x="480" y="564" width="360" height="58" rx="8" fill="#ffffff" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="660" y="589" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">bare metal server</text>
  <text x="660" y="608" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#828592">server-3 · PXE booting</text>

  <!-- Tenant Network — x=960, w=400, h=364 -->
  <rect x="960" y="278" width="400" height="364" rx="12" fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
  <text x="982" y="308" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#050B24">Tenant Network</text>
  <text x="982" y="328" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">Kubernetes workload traffic</text>

  <!-- Tenant cluster dashed boundary — fills inner width (x=980, w=360, h=274)
       16px consistent padding on all four sides inside the dashed box -->
  <rect x="980" y="348" width="360" height="274" rx="8" fill="none" stroke="#326CE3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1160" y="372" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#050B24">tenant cluster</text>

  <!-- Provisioned node server-1 — x=996, w=328, y=390 -->
  <rect x="996" y="390" width="328" height="58" rx="8" fill="#EAF0FC" stroke="#326CE3" stroke-width="1.5"/>
  <text x="1160" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">provisioned node</text>
  <text x="1160" y="434" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">server-1</text>

  <!-- Provisioned node server-2 — y=469 (21px gap) -->
  <rect x="996" y="469" width="328" height="58" rx="8" fill="#EAF0FC" stroke="#326CE3" stroke-width="1.5"/>
  <text x="1160" y="494" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">provisioned node</text>
  <text x="1160" y="513" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">server-2</text>

  <!-- Provisioned node server-3 — y=548 (21px gap) -->
  <rect x="996" y="548" width="328" height="58" rx="8" fill="#EAF0FC" stroke="#326CE3" stroke-width="1.5"/>
  <text x="1160" y="573" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#050B24">provisioned node</text>
  <text x="1160" y="592" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#696D7C">server-3</text>

  <!-- Provisioning → Tenant: joins cluster
       Arrow in 100px gap (x=860..960); label fits entirely within gap -->
  <path d="M 864 535 H 956"
        stroke="#B4B6BD" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="910" y="555" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#050B24">joins cluster</text>
</svg>
