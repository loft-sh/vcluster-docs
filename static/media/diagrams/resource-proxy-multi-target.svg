<svg viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A client tenant cluster routing different API groups through separate proxies to two target tenant clusters">
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="resource-proxy-multi-target-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#050B24"/>
    </marker>
    <marker id="resource-proxy-multi-target-arrow-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#828592"/>
    </marker>
  </defs>

  <rect width="1100" height="500" fill="#FFFFFF"/>
  <rect x="30" y="30" width="1040" height="440" rx="12" fill="#F8F9FB" stroke="#E6E7E9" stroke-width="1.5"/>
  <text x="52" y="60" font-size="14" font-weight="600" fill="#505466">API group and version determine the target</text>

  <rect x="64" y="92" width="346" height="340" rx="12" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.3"/>
  <text x="88" y="122" font-size="15" font-weight="600" fill="#050B24">Client tenant cluster</text>
  <text x="88" y="143" font-size="14" fill="#828592">One proxy per configured group and version</text>

  <rect x="94" y="184" width="286" height="78" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="237" y="213" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">example.com/v1 proxy</text>
  <text x="237" y="235" text-anchor="middle" font-size="14" fill="#828592">MyResource, SecondaryResource</text>
  <rect x="132" y="241" width="210" height="6" rx="3" fill="#FF6600" opacity="0.18"/>

  <rect x="94" y="310" width="286" height="78" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="237" y="339" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">test.io/v2 proxy</text>
  <text x="237" y="361" text-anchor="middle" font-size="14" fill="#828592">OtherResource, AdditionalResource</text>
  <rect x="132" y="367" width="210" height="6" rx="3" fill="#FF6600" opacity="0.18"/>

  <rect x="560" y="82" width="476" height="176" rx="12" fill="#FFFFFF" stroke="#326CE3" stroke-width="1.3"/>
  <text x="584" y="112" font-size="14" font-weight="600" fill="#050B24">target-a tenant cluster</text>
  <rect x="592" y="142" width="120" height="72" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.7"/>
  <text x="652" y="173" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">Target API</text>
  <text x="652" y="195" text-anchor="middle" font-size="14" fill="#828592">example.com/v1</text>
  <rect x="770" y="126" width="230" height="50" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="885" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">MyResource objects</text>
  <rect x="770" y="190" width="230" height="50" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="885" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">SecondaryResource objects</text>

  <rect x="560" y="280" width="476" height="176" rx="12" fill="#FFFFFF" stroke="#326CE3" stroke-width="1.3"/>
  <text x="584" y="310" font-size="14" font-weight="600" fill="#050B24">target-b tenant cluster</text>
  <rect x="592" y="340" width="120" height="72" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.7"/>
  <text x="652" y="371" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">Target API</text>
  <text x="652" y="393" text-anchor="middle" font-size="14" fill="#828592">test.io/v2</text>
  <rect x="770" y="324" width="230" height="50" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="885" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">OtherResource objects</text>
  <rect x="770" y="388" width="230" height="50" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="885" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">AdditionalResource objects</text>

  <path d="M380 223 Q485 200 590 178" fill="none" stroke="#050B24" stroke-width="1.8" marker-end="url(#resource-proxy-multi-target-arrow)"/>
  <text x="485" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#505466">route to target-a</text>

  <path d="M380 349 Q485 362 590 376" fill="none" stroke="#050B24" stroke-width="1.8" marker-end="url(#resource-proxy-multi-target-arrow)"/>
  <text x="485" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#505466">route to target-b</text>

  <line x1="712" y1="167" x2="768" y2="151" stroke="#828592" stroke-width="1.4" marker-end="url(#resource-proxy-multi-target-arrow-muted)"/>
  <line x1="712" y1="194" x2="768" y2="213" stroke="#828592" stroke-width="1.4" marker-end="url(#resource-proxy-multi-target-arrow-muted)"/>
  <line x1="712" y1="365" x2="768" y2="349" stroke="#828592" stroke-width="1.4" marker-end="url(#resource-proxy-multi-target-arrow-muted)"/>
  <line x1="712" y1="392" x2="768" y2="413" stroke="#828592" stroke-width="1.4" marker-end="url(#resource-proxy-multi-target-arrow-muted)"/>
</svg>
