<svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Client tenant clusters in two projects proxying resources to a target tenant cluster in another project">
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="resource-proxy-cross-project-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#050B24"/>
    </marker>
  </defs>

  <rect width="1100" height="480" fill="#FFFFFF"/>
  <rect x="30" y="30" width="1040" height="420" rx="12" fill="#F8F9FB" stroke="#E6E7E9" stroke-width="1.5"/>
  <text x="52" y="60" font-size="14" font-weight="600" fill="#505466">vCluster Platform</text>
  <text x="1048" y="60" text-anchor="end" font-size="14" fill="#828592">Projects organize access; the Platform network carries proxy traffic</text>

  <rect x="66" y="92" width="364" height="142" rx="12" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.3"/>
  <text x="88" y="120" font-size="14" font-weight="600" fill="#505466">project-a</text>
  <rect x="104" y="146" width="288" height="62" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="248" y="172" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">client tenant cluster</text>
  <text x="248" y="193" text-anchor="middle" font-size="14" fill="#828592">targets other-project/target</text>

  <rect x="66" y="266" width="364" height="142" rx="12" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.3"/>
  <text x="88" y="294" font-size="14" font-weight="600" fill="#505466">project-b</text>
  <rect x="104" y="320" width="288" height="62" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="248" y="346" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">another client tenant cluster</text>
  <text x="248" y="367" text-anchor="middle" font-size="14" fill="#828592">targets other-project/target</text>

  <rect x="628" y="92" width="406" height="316" rx="12" fill="#FFFFFF" stroke="#326CE3" stroke-width="1.3"/>
  <text x="652" y="120" font-size="14" font-weight="600" fill="#505466">other-project</text>
  <rect x="678" y="172" width="306" height="154" rx="10" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="831" y="205" text-anchor="middle" font-size="15" font-weight="650" fill="#050B24">target tenant cluster</text>
  <text x="831" y="228" text-anchor="middle" font-size="14" fill="#828592">central resource storage</text>
  <rect x="720" y="254" width="222" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="831" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">MyResource objects</text>
  <text x="831" y="346" text-anchor="middle" font-size="14" fill="#828592">Clients authenticate with Platform identities</text>
  <text x="831" y="367" text-anchor="middle" font-size="14" fill="#828592">Platform and target RBAC authorize access</text>

  <path d="M392 177 H520 Q554 177 584 205 L676 236" fill="none" stroke="#050B24" stroke-width="1.8" marker-end="url(#resource-proxy-cross-project-arrow)"/>
  <path d="M392 351 H520 Q554 351 584 323 L676 265" fill="none" stroke="#050B24" stroke-width="1.8" marker-end="url(#resource-proxy-cross-project-arrow)"/>

  <text x="526" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#505466">cross-project proxy</text>
  <text x="526" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#505466">cross-project proxy</text>

  <rect x="666" y="382" width="330" height="20" rx="10" fill="#F3F5F9"/>
  <text x="831" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#626675">Projects can span different control plane clusters</text>
</svg>
