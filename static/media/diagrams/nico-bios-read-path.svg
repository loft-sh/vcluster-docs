<svg viewBox="0 0 928 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-wide description-wide">
  <title id="title-wide">How the platform reads a machine's BIOS</title>
  <desc id="description-wide">The host validation controller in vCluster Platform sends a Redfish read to nico-bmc-proxy and authenticates with a client certificate. The proxy fetches the BMC credential from the NICo API and forwards the read to the machine's BMC. The BIOS attributes come back to the controller, which records the result in the Machine's status.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', sans-serif; }
    ]]></style>
    <marker id="arrow-wide" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="928" height="312" fill="#FFFFFF"/>

  <g>
  <rect x="20" y="20" width="266" height="272" rx="14" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="40" y="50" font-size="18" font-weight="600" fill="#050B24">vCluster Platform</text>
  <text x="40" y="72" font-size="14" fill="#696D7C">On the control plane cluster</text>
  <rect x="436" y="20" width="198" height="272" rx="14" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
  <text x="456" y="50" font-size="18" font-weight="600" fill="#050B24">NICo installation</text>
  <text x="456" y="72" font-size="14" fill="#696D7C">Run by the site</text>
  <rect x="40" y="96" width="226" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="153" y="130" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Host validation controller</text>
  <rect x="40" y="216" width="226" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="153" y="250" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Machine status</text>
  <rect x="456" y="96" width="158" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="535" y="130" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">nico-bmc-proxy</text>
  <rect x="456" y="216" width="158" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="535" y="250" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">NICo API</text>
  <rect x="754" y="96" width="154" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="831" y="130" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Machine's BMC</text>

  <!-- Arrows: 1.5px, tail at source edge + 4, tip at target edge - 4 -->
  <path d="M 270 116 H 452" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="361" y="106" font-size="15" fill="#050B24" text-anchor="middle">client certificate</text>
  <path d="M 452 132 H 270" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="361" y="150" font-size="15" fill="#050B24" text-anchor="middle">BIOS attributes</text>
  <path d="M 618 124 H 750" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="684" y="116" font-size="15" fill="#050B24" text-anchor="middle">Redfish GET</text>
  <path d="M 64 156 V 212" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="76" y="189" font-size="15" fill="#050B24">records result</text>
  <path d="M 480 212 V 156" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="492" y="189" font-size="15" fill="#050B24">BMC credential</text>
  </g>
</svg>
