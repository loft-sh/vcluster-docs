<svg viewBox="0 0 797 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four layers stacked top to bottom: clusters and services, vCluster Platform, the control plane cluster, and machines provisioned by vMetal. Arrows show where each starting point begins. Servers only starts at the machines layer. A provisioner or machine inventory starts at the control plane cluster. Kubernetes clusters, and clusters created with vCluster, start at vCluster Platform.">
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="starting-point-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>
<rect x="0" y="0" width="797" height="470" fill="#FFFFFF"/>
<text x="28.0" y="50.0" font-size="14" font-weight="600" fill="#050B24">What you already run</text>
<text x="378.0" y="50.0" font-size="14" font-weight="600" fill="#050B24">Layers of your platform</text>
<rect x="378.0" y="66.0" width="391.0" height="72.0" rx="12" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="398.0" y="98.0" font-size="16" font-weight="600" fill="#050B24">Clusters and services</text>
<text x="398.0" y="120.0" font-size="14" font-weight="400" fill="#828592">Clusters, instances, and apps for your tenants</text>
<rect x="378.0" y="150.0" width="391.0" height="124.0" rx="12" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
<text x="398.0" y="208.0" font-size="16" font-weight="600" fill="#050B24">vCluster Platform</text>
<text x="398.0" y="230.0" font-size="14" font-weight="400" fill="#696D7C">Tenants, projects, templates, and the service catalog</text>
<rect x="28.0" y="166.0" width="278.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="44.0" y="191.0" font-size="14" font-weight="600" fill="#050B24">Kubernetes clusters</text>
<line x1="310.0" y1="186.0" x2="374.0" y2="186.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#starting-point-arrow)"/>
<rect x="28.0" y="218.0" width="278.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="44.0" y="243.0" font-size="14" font-weight="600" fill="#050B24">Clusters created with vCluster</text>
<line x1="310.0" y1="238.0" x2="374.0" y2="238.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#starting-point-arrow)"/>
<rect x="378.0" y="286.0" width="391.0" height="72.0" rx="12" fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
<text x="398.0" y="318.0" font-size="16" font-weight="600" fill="#050B24">Control plane cluster</text>
<text x="398.0" y="340.0" font-size="14" font-weight="400" fill="#696D7C">The Kubernetes cluster that vCluster Platform runs on</text>
<rect x="28.0" y="302.0" width="278.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="44.0" y="327.0" font-size="14" font-weight="600" fill="#050B24">A provisioner or machine inventory</text>
<line x1="310.0" y1="322.0" x2="374.0" y2="322.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#starting-point-arrow)"/>
<rect x="378.0" y="370.0" width="391.0" height="72.0" rx="12" fill="#E6F8FB" stroke="#00B7D6" stroke-width="2"/>
<text x="398.0" y="402.0" font-size="16" font-weight="600" fill="#050B24">Machines</text>
<text x="398.0" y="424.0" font-size="14" font-weight="400" fill="#696D7C">Servers and VMs, provisioned by vMetal</text>
<rect x="28.0" y="386.0" width="278.0" height="40.0" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="44.0" y="411.0" font-size="14" font-weight="600" fill="#050B24">Servers only</text>
<line x1="310.0" y1="406.0" x2="374.0" y2="406.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#starting-point-arrow)"/>
</svg>
