<svg viewBox="0 0 380 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-narrow description-narrow">
  <title id="title-narrow">External platform provisioning</title>
  <desc id="description-narrow">A cluster on the local vCluster Platform creates a local NodeClaim. The local NodeClaim is mirrored as a remote NodeClaim on the remote vCluster Platform. The remote NodeClaim is handled by the Metal3 provider, which installs a bare metal server. The server joins the cluster on the local platform.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', sans-serif; }
    ]]></style>
    <marker id="arrow-narrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="380" height="784" fill="#FFFFFF"/>
  <text x="190" y="36" font-size="28" font-weight="700" fill="#050B24" text-anchor="middle">
    <tspan x="190">External platform</tspan><tspan x="190" dy="32">provisioning</tspan>
  </text>

  <rect x="20" y="108" width="340" height="248" rx="14" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="40" y="138" font-size="18" font-weight="600" fill="#050B24">Local platform</text>
  <text x="40" y="160" font-size="14" fill="#696D7C">Runs the cluster</text>

  <rect x="20" y="412" width="340" height="352" rx="14" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="40" y="442" font-size="18" font-weight="600" fill="#050B24">Remote platform</text>
  <text x="40" y="464" font-size="14" fill="#696D7C">Owns the servers</text>

  <rect x="120" y="184" width="160" height="48" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="200" y="213" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Cluster</text>
  <rect x="120" y="288" width="160" height="48" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="200" y="317" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Local NodeClaim</text>
  <rect x="120" y="488" width="160" height="48" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="200" y="517" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Remote NodeClaim</text>
  <rect x="120" y="592" width="160" height="48" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="200" y="621" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Metal3 provider</text>
  <rect x="120" y="696" width="160" height="48" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="200" y="725" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Bare metal server</text>

  <path d="M 200 236 V 284" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="212" y="266" font-size="15" fill="#050B24">creates</text>
  <path d="M 200 340 V 484" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="212" y="388" font-size="15" fill="#050B24">mirrored as</text>
  <path d="M 200 540 V 588" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="212" y="570" font-size="15" fill="#050B24">handled by</text>
  <path d="M 200 644 V 692" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="212" y="674" font-size="15" fill="#050B24">installs</text>

  <path d="M 284 720 H 320 V 208 H 284" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="337" y="590" font-size="15" fill="#050B24" text-anchor="middle" transform="rotate(-90 337 590)">joins cluster</text>
</svg>
