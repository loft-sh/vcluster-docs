<svg viewBox="0 0 865 382" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vCluster Platform contains Tenants, each Tenant contains projects, and each project contains clusters. A system admin installs Platform, a platform admin creates Tenants, a tenant admin creates projects, and a project user creates clusters.">
