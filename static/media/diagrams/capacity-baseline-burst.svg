<svg viewBox="0 0 723 198" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One tenant's capacity for a node type, shown as a bar. A reserved baseline of machines reserved for the tenant is guaranteed. An on-demand burst above it uses unassigned machines when any are free. A dashed line marks the node type quota, the ceiling. Requests above the quota are refused.">
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="capacity-burst-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>
<rect x="0" y="0" width="723" height="198" fill="#FFFFFF"/>
<rect x="28.0" y="62.0" width="246.0" height="56.0" rx="8" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
<text x="151.0" y="95.0" font-size="14" font-weight="600" fill="#050B24" text-anchor="middle">Reserved baseline</text>
<rect x="282.0" y="62.0" width="219.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="391.5" y="95.0" font-size="14" font-weight="600" fill="#050B24" text-anchor="middle">On-demand burst</text>
<line x1="513.0" y1="56.0" x2="513.0" y2="124.0" stroke="#B4B6BD" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="513.0" y="44.0" font-size="14" font-weight="600" fill="#050B24" text-anchor="middle">Node type quota</text>
<text x="151.0" y="146.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Guaranteed. Machines</text>
<text x="151.0" y="166.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">reserved for the tenant.</text>
<text x="391.5" y="146.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Unassigned machines,</text>
<text x="391.5" y="166.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">when any are free.</text>
<text x="610.0" y="146.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Requests above</text>
<text x="610.0" y="166.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">the quota are refused.</text>
</svg>
