  <text x="38" y="451" class="brand" text-anchor="middle">vMetal</text>

  <!-- vMetal boundary -->
  <rect x="70" y="334" width="1190" height="260" rx="16" fill="#E6F8FB" stroke="#00B7D6" stroke-width="2"/>
  <text x="92" y="363" class="section" fill="#00A8C5">Machines</text>

  <g class="card" stroke="#00B7D6" filter="url(#shadow)">
    <rect x="92" y="376" width="560" height="52" rx="7"/>
    <rect x="668" y="376" width="570" height="52" rx="7"/>
  </g>
  <g fill="none" stroke="#00B7D6" stroke-width="2">
    <rect x="110" y="389" width="26" height="10" rx="1"/>
    <rect x="110" y="405" width="26" height="10" rx="1"/>
    <circle cx="116" cy="394" r="1.5" fill="#00B7D6"/>
    <circle cx="116" cy="410" r="1.5" fill="#00B7D6"/>
    <rect x="687" y="388" width="28" height="22" rx="3"/>
    <path d="M695 415h12M701 410v5M694 399h14M697 396l4-4 4 4"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="372" y="408">Physical Machines</text>
    <text x="953" y="408">Virtual Machines</text>
  </g>

  <text x="92" y="459" class="section" fill="#00A8C5">Driver ecosystem</text>
  <text x="1238" y="459" class="small" text-anchor="end">Availability varies by version and plan</text>

  <g class="card" stroke="#00B7D6">
    <rect x="92" y="474" width="630" height="92" rx="7"/>
    <rect x="736" y="474" width="150" height="92" rx="7"/>
    <rect x="900" y="474" width="338" height="92" rx="7"/>
  </g>
  <g class="small">
    <text x="108" y="493">BARE-METAL PROVISIONING</text>
    <text x="752" y="493">NETWORK AUTOMATION</text>
    <text x="916" y="493">VM PROVISIONING</text>
  </g>

  <!-- Self-contained brand-style marks and wordmarks -->
  <g transform="translate(118 510)">
    <polygon points="12,0 23,6 23,19 12,26 1,19 1,6" fill="#151B33"/>
    <text x="12" y="17" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">M³</text>
    <text x="31" y="18" class="brand">Metal³</text>
  </g>
  <g transform="translate(258 510)">
    <rect width="21" height="21" rx="3" fill="#76B900"/>
    <path d="M4 11c4-6 10-6 14 0-4 5-10 5-14 0zm4 0c2-2 4-2 6 0-2 2-4 2-6 0z" fill="#FFFFFF"/>
    <text x="29" y="16" class="brand">NVIDIA NICO</text>
  </g>
  <g transform="translate(398 510)">
    <rect width="21" height="21" rx="3" fill="#76B900"/>
    <path d="M4 11c4-6 10-6 14 0-4 5-10 5-14 0zm4 0c2-2 4-2 6 0-2 2-4 2-6 0z" fill="#FFFFFF"/>
