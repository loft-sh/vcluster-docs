  <!-- Customer-owned infrastructure -->
  <rect x="70" y="612" width="1190" height="34" rx="8" fill="#050B24"/>
  <text x="640" y="634" text-anchor="middle">
    <tspan font-size="14" font-weight="750" fill="#FFFFFF">YOUR INFRASTRUCTURE</tspan>
    <tspan dx="18" font-size="13" font-weight="500" fill="#B4B6BD">BARE METAL, GPU AND CPU SERVERS · NETWORKING · STORAGE</tspan>
  </text>
</svg>
