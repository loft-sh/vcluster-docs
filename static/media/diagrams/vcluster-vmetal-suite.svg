    <path d="M582 207l7 7"/>
    <path d="M788 211c0-7 10-9 14-3 4-6 14-4 14 3 0 7-14 15-14 15s-14-8-14-15zM786 215h9l3-6 5 12 4-6h11"/>
    <rect x="1014" y="201" width="24" height="18" rx="2"/>
    <path d="M1014 207h24M1044 214v14M1037 221h14"/>
  </g>
  <g class="label">
    <text x="144" y="220">Cluster templates</text>
    <text x="368" y="220" font-size="14">Capacity management</text>
    <text x="600" y="220">Observability</text>
    <text x="828" y="220">Node autohealing</text>
    <text x="1055" y="220">Billing and access</text>
  </g>

  <!-- Stable upward contract -->
  <line x1="78" y1="304" x2="1252" y2="304" stroke="#117F8C" stroke-width="1.5" stroke-dasharray="2 5"/>
  <rect x="442" y="288" width="446" height="32" rx="16" fill="#117F8C"/>
  <path d="M566 309l7-11 7 11z" fill="#FFFFFF"/>
  <text x="675" y="309" font-size="14" font-weight="750" fill="#FFFFFF" text-anchor="middle">Stable Machine API</text>

  <!-- vMetal identity -->
  <g transform="translate(22 397)" fill="#00B7D6">
    <rect x="0" y="4" width="7" height="28" rx="1"/>
    <rect x="10" y="14" width="7" height="18" rx="1"/>
    <rect x="20" y="0" width="7" height="32" rx="1"/>
    <path d="M0 35h30v4H0z"/>
