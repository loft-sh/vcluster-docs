  </g>
  <g transform="translate(538 510)">
    <circle cx="11" cy="11" r="10" fill="none" stroke="#E95420" stroke-width="3" stroke-dasharray="12 3"/>
    <circle cx="11" cy="11" r="3" fill="#E95420"/>
    <text x="29" y="16" font-size="11.5" font-weight="750" fill="#2F3446">Canonical MAAS</text>
  </g>

  <g transform="translate(752 508)">
    <circle cx="13" cy="13" r="4" fill="#050B24"/>
    <circle cx="2" cy="4" r="2.5" fill="#050B24"/>
    <circle cx="24" cy="4" r="2.5" fill="#050B24"/>
    <circle cx="2" cy="22" r="2.5" fill="#050B24"/>
    <circle cx="24" cy="22" r="2.5" fill="#050B24"/>
