  <text x="92" y="168" class="section" fill="#FF6600">vCluster Platform · Tenant management</text>
  <g class="card" stroke="#FF6600">
    <rect x="92" y="184" width="214" height="62" rx="7"/>
    <rect x="318" y="184" width="214" height="62" rx="7"/>
    <rect x="544" y="184" width="214" height="62" rx="7"/>
    <rect x="770" y="184" width="214" height="62" rx="7"/>
    <rect x="996" y="184" width="242" height="62" rx="7"/>
  </g>
