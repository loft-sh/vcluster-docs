<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="suite-title suite-desc">
  <title id="suite-title">vCluster and vMetal product suite</title>
  <desc id="suite-desc">vCluster combines tenant-facing Kubernetes, Slurm, Run:ai, Ray, inference, agent sandbox, and other compute clusters with a platform for tenant and capacity management. A stable Machine API connects vCluster to physical and virtual Machines managed by vMetal through bare-metal, network, and virtual-machine drivers. Driver availability varies by version and plan.</desc>
  <defs>
    <style>
      text { font-family: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { font-size: 19px; font-weight: 750; fill: #050B24; }
      .section { font-size: 16px; font-weight: 750; }
      .label { font-size: 15px; font-weight: 700; fill: #050B24; }
      .body { font-size: 13px; font-weight: 500; fill: #696D7C; }
      .small { font-size: 11px; font-weight: 550; fill: #696D7C; }
      .brand { font-size: 13px; font-weight: 750; fill: #2F3446; }
      .card { fill: #FFFFFF; stroke-width: 1.5; }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#050B24" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="660" rx="18" fill="#FFFFFF"/>

  <!-- vCluster identity -->
  <g transform="translate(20 101) scale(1.15)">
    <path d="M16.7605 13.2207L20.7134 20.0835L32 0.282252L24.1557 0.246399L16.7605 13.2207Z" fill="#FF6600"/>
    <path d="M4.49512 12.3052L15.7818 32.1081L19.7347 25.2437L12.3394 12.2693L4.49512 12.3052Z" fill="#FF6600"/>
    <path d="M19.2857 1.95648H4.63351C1.09214 1.95648 -1.13616 5.77195 0.603788 8.85505H15.3926L19.284 1.95648H19.2857Z" fill="#FF6600"/>
  </g>
  <text x="38" y="151" class="brand" text-anchor="middle">vCluster</text>

  <!-- Combined vCluster product boundary -->
  <rect x="70" y="20" width="1190" height="254" rx="16" fill="#FFF0E6" stroke="#FF6600" stroke-width="2"/>
  <text x="92" y="48" class="section" fill="#FF6600">Tenant clusters</text>
  <text x="1238" y="48" class="small" text-anchor="end">Highly scalable, resilient compute products</text>

  <!-- Tenant cluster products -->
  <g class="card" stroke="#FF6600" filter="url(#shadow)">
    <rect x="92" y="62" width="150" height="74" rx="8"/>
    <rect x="254" y="62" width="150" height="74" rx="8"/>
    <rect x="416" y="62" width="150" height="74" rx="8"/>
    <rect x="578" y="62" width="150" height="74" rx="8"/>
    <rect x="740" y="62" width="150" height="74" rx="8"/>
    <rect x="902" y="62" width="150" height="74" rx="8"/>
    <rect x="1064" y="62" width="174" height="74" rx="8"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="167" y="92"><tspan x="167">Kubernetes</tspan><tspan x="167" dy="19">clusters</tspan></text>
    <text x="329" y="92"><tspan x="329">Slurm</tspan><tspan x="329" dy="19">clusters</tspan></text>
    <text x="491" y="92"><tspan x="491">Run:ai</tspan><tspan x="491" dy="19">clusters</tspan></text>
    <text x="653" y="92"><tspan x="653">Ray</tspan><tspan x="653" dy="19">clusters</tspan></text>
    <text x="815" y="92"><tspan x="815">Inference</tspan><tspan x="815" dy="19">clusters</tspan></text>
    <text x="977" y="83"><tspan x="977">Agent</tspan><tspan x="977" dy="18">sandbox</tspan><tspan x="977" dy="18">clusters</tspan></text>
    <text x="1151" y="102">More cluster products</text>
  </g>

