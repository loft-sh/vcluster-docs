<svg viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two client tenant clusters proxying to one target while owner labels isolate each client's resources">
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="resource-proxy-isolation-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#050B24"/>
    </marker>
    <marker id="resource-proxy-isolation-arrow-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#828592"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="#FFFFFF"/>
  <rect x="30" y="30" width="1040" height="460" rx="12" fill="#F8F9FB" stroke="#E6E7E9" stroke-width="1.5"/>
  <text x="52" y="60" font-size="14" font-weight="600" fill="#505466">Owner-label isolation across clients</text>

  <rect x="62" y="90" width="398" height="164" rx="12" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.3"/>
  <text x="84" y="119" font-size="14" font-weight="600" fill="#050B24">team-a tenant cluster</text>
  <rect x="88" y="148" width="126" height="60" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="151" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">kubectl</text>
  <text x="151" y="193" text-anchor="middle" font-size="14" fill="#828592">team-a caller</text>
  <rect x="270" y="124" width="170" height="116" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="355" y="150" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">Resource proxy</text>
  <text x="355" y="173" text-anchor="middle" font-size="14" fill="#828592">attempts owner labels</text>
  <text x="355" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#FF6600">owner-vcluster</text>
  <text x="355" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#FF6600">owner-project</text>
  <text x="355" y="232" text-anchor="middle" font-size="14" fill="#828592">injects matching selector</text>

  <rect x="62" y="282" width="398" height="164" rx="12" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.3"/>
  <text x="84" y="311" font-size="14" font-weight="600" fill="#050B24">team-b tenant cluster</text>
  <rect x="88" y="340" width="126" height="60" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="151" y="366" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">kubectl</text>
  <text x="151" y="385" text-anchor="middle" font-size="14" fill="#828592">team-b caller</text>
  <rect x="270" y="316" width="170" height="116" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="355" y="342" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">Resource proxy</text>
  <text x="355" y="365" text-anchor="middle" font-size="14" fill="#828592">attempts owner labels</text>
  <text x="355" y="386" text-anchor="middle" font-size="14" font-weight="600" fill="#FF6600">owner-vcluster</text>
  <text x="355" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#FF6600">owner-project</text>
  <text x="355" y="424" text-anchor="middle" font-size="14" fill="#828592">injects matching selector</text>

  <rect x="590" y="90" width="448" height="356" rx="12" fill="#FFFFFF" stroke="#326CE3" stroke-width="1.3"/>
  <text x="614" y="119" font-size="14" font-weight="600" fill="#050B24">Target tenant cluster</text>
  <text x="614" y="140" font-size="14" fill="#828592">One resource API, filtered views for each client</text>

  <rect x="620" y="180" width="132" height="78" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="686" y="209" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">Target API</text>
  <text x="686" y="230" text-anchor="middle" font-size="14" fill="#828592">honors injected</text>
  <text x="686" y="247" text-anchor="middle" font-size="14" fill="#828592">label selector</text>

  <rect x="806" y="166" width="198" height="58" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="905" y="191" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">MyResource objects</text>
  <text x="905" y="210" text-anchor="middle" font-size="14" fill="#828592">shared resource collection</text>

  <rect x="806" y="246" width="198" height="78" rx="8" fill="#FFF7F2" stroke="#FF8433" stroke-width="1.4"/>
  <text x="905" y="273" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">team-a-resource</text>
  <text x="905" y="298" text-anchor="middle" font-size="14" font-weight="600" fill="#FF6600">owner-vcluster: team-a</text>
  <text x="905" y="317" text-anchor="middle" font-size="14" fill="#828592">owner-project: shared-project</text>

  <rect x="806" y="342" width="198" height="78" rx="8" fill="#F3F5F9" stroke="#9B9DA7" stroke-width="1.3"/>
  <text x="905" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">team-b-resource</text>
  <text x="905" y="394" text-anchor="middle" font-size="14" font-weight="600" fill="#626675">owner-vcluster: team-b</text>
  <text x="905" y="413" text-anchor="middle" font-size="14" fill="#828592">owner-project: shared-project</text>

  <line x1="214" y1="178" x2="268" y2="178" stroke="#828592" stroke-width="1.5" marker-end="url(#resource-proxy-isolation-arrow-muted)"/>
  <line x1="214" y1="370" x2="268" y2="370" stroke="#828592" stroke-width="1.5" marker-end="url(#resource-proxy-isolation-arrow-muted)"/>
  <path d="M440 178 H522 Q548 178 570 203 L618 219" fill="none" stroke="#050B24" stroke-width="1.7" marker-end="url(#resource-proxy-isolation-arrow)"/>
  <path d="M440 370 H522 Q548 370 570 345 L618 239" fill="none" stroke="#050B24" stroke-width="1.7" marker-end="url(#resource-proxy-isolation-arrow)"/>
  <line x1="752" y1="209" x2="804" y2="196" stroke="#050B24" stroke-width="1.4" marker-end="url(#resource-proxy-isolation-arrow)"/>
  <path d="M905 224 V238 H782 V381" fill="none" stroke="#828592" stroke-width="1.4"/>
  <line x1="782" y1="285" x2="804" y2="285" stroke="#828592" stroke-width="1.4" marker-end="url(#resource-proxy-isolation-arrow-muted)"/>
  <line x1="782" y1="381" x2="804" y2="381" stroke="#828592" stroke-width="1.4" marker-end="url(#resource-proxy-isolation-arrow-muted)"/>

  <path d="M440 210 C560 300 690 308 804 308" fill="none" stroke="#FF8433" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#resource-proxy-isolation-arrow-muted)"/>
  <path d="M440 402 C566 432 690 404 804 404" fill="none" stroke="#828592" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#resource-proxy-isolation-arrow-muted)"/>
</svg>
