<svg viewBox="0 0 440 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-narrow description-narrow">
  <title id="title-narrow">How the platform reads a machine's BIOS</title>
  <desc id="description-narrow">The host validation controller in vCluster Platform sends a Redfish read to nico-bmc-proxy and authenticates with a client certificate. The proxy fetches the BMC credential from the NICo API and forwards the read to the machine's BMC. The BIOS attributes come back to the controller, which records the result in the Machine's status.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', sans-serif; }
    ]]></style>
    <marker id="arrow-narrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="440" height="680" fill="#FFFFFF"/>

  <g>
  <rect x="20" y="20" width="400" height="272" rx="14" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="40" y="50" font-size="18" font-weight="600" fill="#050B24">vCluster Platform</text>
  <text x="40" y="72" font-size="14" fill="#696D7C">On the control plane cluster</text>
  <rect x="20" y="372" width="400" height="152" rx="14" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
  <text x="40" y="402" font-size="18" font-weight="600" fill="#050B24">NICo installation</text>
  <text x="40" y="424" font-size="14" fill="#696D7C">Run by the site</text>
  <rect x="40" y="96" width="360" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="220" y="130" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Machine status</text>
  <rect x="40" y="216" width="360" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="220" y="250" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Host validation controller</text>
  <rect x="40" y="448" width="101" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="90.5" y="482" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">NICo API</text>
  <rect x="242" y="448" width="158" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="321" y="482" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">nico-bmc-proxy</text>
  <rect x="244" y="604" width="154" height="56" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="321" y="638" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Machine's BMC</text>

  <!-- Arrows: 1.5px, tail at source edge + 4, tip at target edge - 4 -->
  <path d="M 64 212 V 156" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="76" y="189" font-size="15" fill="#050B24">records result</text>
  <path d="M 307 276 V 444" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="295" y="337" font-size="15" fill="#050B24" text-anchor="end">client certificate</text>
  <path d="M 335 444 V 276" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="347" y="328" font-size="15" fill="#050B24"><tspan x="347">BIOS</tspan><tspan x="347" dy="18">attributes</tspan></text>
  <path d="M 145 476 H 238" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="191.5" y="468" font-size="15" fill="#050B24" text-anchor="middle">credential</text>
  <path d="M 321 508 V 600" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-narrow)"/>
  <text x="333" y="567" font-size="15" fill="#050B24">Redfish GET</text>
  </g>
</svg>
