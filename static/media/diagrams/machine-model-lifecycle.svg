<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="600" height="390">
  <title>Machine lifecycle</title>
  <desc>A Machine moves through six milestones: Requested, Scheduled, Provisioned, Joined, Ready, and Destroyed. Joined applies only to tenant-cluster capacity. After Destroyed, the server it claimed is cleaned and returned to its capacity pool, where a new Machine can claim it.</desc>
  <defs>
    <marker id="machine-model-lifecycle-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="600" height="390" fill="#ffffff"/>

  <!-- First row: request through provisioning -->
  <rect x="25" y="40" width="160" height="70" rx="10" fill="#FFF0E6" stroke="#FF6600" stroke-width="1.5"/>
  <text x="105" y="81" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#050B24">Requested</text>

  <rect x="220" y="40" width="160" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="300" y="81" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#050B24">Scheduled</text>

  <rect x="415" y="40" width="160" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="495" y="81" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#050B24">Provisioned</text>

  <!-- Second row continues right to left -->
  <rect x="415" y="280" width="160" height="70" rx="10" fill="#E8ECFD" stroke="#1846ED" stroke-width="1.5"/>
  <text x="495" y="321" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#050B24">Joined</text>

  <rect x="220" y="280" width="160" height="70" rx="10" fill="#E6F8FB" stroke="#00B7D6" stroke-width="1.5"/>
  <text x="300" y="321" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#050B24">Ready</text>

  <rect x="25" y="280" width="160" height="70" rx="10" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="105" y="321" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#050B24">Destroyed</text>

  <!-- Forward lifecycle -->
  <line x1="189" y1="75" x2="216" y2="75" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-model-lifecycle-arrow)"/>
  <line x1="384" y1="75" x2="411" y2="75" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-model-lifecycle-arrow)"/>
  <line x1="495" y1="114" x2="495" y2="276" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-model-lifecycle-arrow)"/>
  <line x1="411" y1="315" x2="384" y2="315" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-model-lifecycle-arrow)"/>
  <line x1="216" y1="315" x2="189" y2="315" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#machine-model-lifecycle-arrow)"/>

  <!-- Server reuse loop: a different, later Machine claims the same freed server -->
  <line x1="105" y1="276" x2="105" y2="114" stroke="#B4B6BD" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#machine-model-lifecycle-arrow)"/>
  <rect x="112" y="181" width="161" height="28" rx="4" fill="#ffffff"/>
  <text x="120" y="200" font-family="Inter, sans-serif" font-size="14" fill="#050B24">server freed for reuse</text>
</svg>
