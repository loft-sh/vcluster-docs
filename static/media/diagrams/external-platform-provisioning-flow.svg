<svg viewBox="0 0 910 406" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-wide description-wide">
  <title id="title-wide">Provision nodes from an external platform</title>
  <desc id="description-wide">A cluster on the local vCluster Platform creates a local NodeClaim. The local platform creates a matching NodeClaim on the remote vCluster Platform. The remote NodeClaim provisions through the Metal3 provider, which installs a bare metal server. The server joins the cluster on the local platform.</desc>
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', sans-serif; }
    ]]></style>
    <marker id="arrow-wide" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>

  <rect width="910" height="406" fill="#FFFFFF"/>

  <text x="455" y="42" font-size="28" font-weight="700" fill="#050B24" text-anchor="middle">External platform provisioning</text>

  <g transform="translate(0,60)">

  <!-- Local vCluster Platform -->
  <rect x="20" y="20" width="160" height="306" rx="14" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="40" y="50" font-size="18" font-weight="600" fill="#050B24">Local platform</text>
  <text x="40" y="72" font-size="14" fill="#696D7C">Runs the cluster</text>

  <!-- Remote vCluster Platform -->
  <rect x="290" y="20" width="600" height="306" rx="14" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
  <text x="310" y="50" font-size="18" font-weight="600" fill="#050B24">Remote platform</text>
  <text x="310" y="72" font-size="14" fill="#696D7C">Owns and provisions the servers</text>

  <rect x="40" y="98" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="100" y="126" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle"><tspan x="100">Local</tspan><tspan x="100" dy="20">NodeClaim</tspan></text>
  <rect x="40" y="242" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="100" y="280" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle">Cluster</text>
  <rect x="310" y="98" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="370" y="126" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle"><tspan x="370">Remote</tspan><tspan x="370" dy="20">NodeClaim</tspan></text>
  <rect x="530" y="98" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="590" y="126" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle"><tspan x="590">Metal3</tspan><tspan x="590" dy="20">provider</tspan></text>
  <rect x="750" y="98" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
  <text x="810" y="126" font-size="16" font-weight="600" fill="#050B24" text-anchor="middle"><tspan x="810">Bare metal</tspan><tspan x="810" dy="20">server</tspan></text>

  <!-- Arrows: 1.5px, tail at source edge + 4, tip at target edge - 4 -->
  <path d="M 100 238 V 166" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="112" y="206" font-size="15" fill="#050B24">creates</text>

  <path d="M 164 130 H 306" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="235" y="122" font-size="15" fill="#050B24" text-anchor="middle">mirrored as</text>

  <path d="M 434 130 H 526" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="480" y="122" font-size="15" fill="#050B24" text-anchor="middle">handled by</text>

  <path d="M 654 130 H 746" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="700" y="122" font-size="15" fill="#050B24" text-anchor="middle">installs</text>

  <path d="M 810 166 V 274 H 164" fill="none" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#arrow-wide)"/>
  <text x="485" y="266" font-size="15" fill="#050B24" text-anchor="middle">joins cluster</text>
  </g>
</svg>
