<svg viewBox="0 0 860 495" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dTitle dDesc">
  <title id="dTitle">Choose a fleet metrics path</title>
  <desc id="dDesc">Decision flow: if you need scoped per-tenant access or GPU observability, use Fleet Observability. Otherwise, if you want a documented Shared Nodes deep-dive, a golden-signal query library, and ready-made Grafana dashboards, use Fleet monitoring with OpenTelemetry. Otherwise, use Aggregating Metrics.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="arr" viewBox="0 0 10 7" markerWidth="8" markerHeight="6" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#828592"/>
    </marker>
  </defs>

  <rect width="860" height="495" fill="#FFFFFF"/>

  <!-- Gate 1 -->
  <rect x="30" y="40" width="480" height="100" rx="10" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="270" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">
    Need per-tenant scoped access
  </text>
  <text x="270" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">
    or GPU observability?
  </text>

  <!-- Outcome 1: Fleet Observability -->
  <rect x="560" y="25" width="270" height="150" rx="10" fill="#FFF8F3" stroke="#CC5100" stroke-width="1.6"/>
  <text x="695" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#050B24">
    Fleet Observability
  </text>
  <text x="695" y="82" text-anchor="middle" font-size="13" fill="#505466">
    Scoped, authenticated access
  </text>
  <text x="695" y="102" text-anchor="middle" font-size="13" fill="#505466">
    Includes GPU observability
  </text>
  <text x="695" y="122" text-anchor="middle" font-size="13" fill="#505466">
    Unavailable on embedded
  </text>
  <text x="695" y="142" text-anchor="middle" font-size="13" fill="#505466">
    Kubernetes platform deployments
  </text>

  <line x1="510" y1="90" x2="558" y2="100" stroke="#828592" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="540" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#CC5100">Yes</text>

  <line x1="270" y1="140" x2="270" y2="228" stroke="#828592" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="288" y="188" text-anchor="middle" font-size="13" fill="#505466">No</text>

  <!-- Gate 2 -->
  <rect x="30" y="230" width="480" height="100" rx="10" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="270" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">
    Want documented Shared Nodes depth,
  </text>
  <text x="270" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">
    golden-signal queries, ready dashboards?
  </text>

  <!-- Outcome 2: Fleet monitoring with OpenTelemetry -->
  <rect x="560" y="215" width="270" height="140" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.4"/>
  <text x="695" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#050B24">
    Fleet monitoring
  </text>
  <text x="695" y="263" text-anchor="middle" font-size="14" font-weight="700" fill="#050B24">
    with OpenTelemetry
  </text>
  <text x="695" y="290" text-anchor="middle" font-size="13" fill="#505466">
    Shared Nodes deep-dive
  </text>
  <text x="695" y="310" text-anchor="middle" font-size="13" fill="#505466">
    Golden-signal PromQL library
  </text>
  <text x="695" y="330" text-anchor="middle" font-size="13" fill="#505466">
    Two ready Grafana dashboards
  </text>

  <line x1="510" y1="280" x2="558" y2="285" stroke="#828592" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="534" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#CC5100">Yes</text>

  <line x1="270" y1="330" x2="270" y2="378" stroke="#828592" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="288" y="358" text-anchor="middle" font-size="13" fill="#505466">No</text>

  <!-- Outcome 3: Aggregating Metrics -->
  <rect x="30" y="380" width="480" height="100" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.4"/>
  <text x="270" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#050B24">
    Aggregating Metrics
  </text>
  <text x="270" y="442" text-anchor="middle" font-size="13" fill="#505466">
    Fastest path to a working dashboard
  </text>
  <text x="270" y="462" text-anchor="middle" font-size="13" fill="#505466">
    One built-in collector App, no gateway
  </text>
</svg>
