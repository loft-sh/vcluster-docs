<svg xmlns="http://www.w3.org/2000/svg" id="netbox-integration-map" viewBox="0 0 1140 458" width="1140" height="458" role="img" aria-labelledby="netbox-map-title netbox-map-description">
<title id="netbox-map-title">NetBox inventory to tenant capacity</title>
<desc id="netbox-map-description">vCluster Platform reads tagged devices from NetBox through a read-only API. A NetBox connector and node provider import them as labeled machines, node types select on those labels, and tenants, projects, and clusters consume the capacity on private nodes.</desc>
<defs><style>@font-face{font-family:Inter;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Inter;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:Inter,sans-serif;fill:#050B24}</style>
<marker id="nb-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/></marker></defs>
<rect width="1140" height="458" fill="#FFFFFF"/>
<text x="570.0" y="60" text-anchor="middle" font-size="32" font-weight="700">NetBox inventory to tenant capacity</text>
<rect x="28" y="104" width="282" height="326" rx="14" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
<text x="169.0" y="144" text-anchor="middle" font-size="22" font-weight="700">NetBox</text>
<text x="169.0" y="170" text-anchor="middle" font-size="18" style="fill:#696D7C">Source of truth</text>
<rect x="48" y="190" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="64" y="220" font-size="20">Tagged devices</text>
<rect x="48" y="248" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="64" y="278" font-size="20">Site, rack, and role</text>
<rect x="48" y="306" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="64" y="336" font-size="20">BMC and boot MAC</text>
<rect x="48" y="364" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="64" y="394" font-size="20">GPU and NIC modules</text>
<rect x="429" y="104" width="282" height="326" rx="14" fill="#FFE0CC" stroke="#FF6600" stroke-width="2"/>
<text x="570.0" y="144" text-anchor="middle" font-size="22" font-weight="700">vCluster Platform</text>
<text x="570.0" y="170" text-anchor="middle" font-size="18" style="fill:#696D7C">Syncs every minute</text>
<rect x="449" y="190" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="465" y="220" font-size="20">NetBox connector</text>
<rect x="449" y="248" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="465" y="278" font-size="20">Node provider</text>
<rect x="449" y="306" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="465" y="336" font-size="20">Labeled machines</text>
<rect x="449" y="364" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="465" y="394" font-size="20">Node types</text>
<rect x="830" y="104" width="282" height="326" rx="14" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
<text x="971.0" y="144" text-anchor="middle" font-size="22" font-weight="700">Tenants</text>
<text x="971.0" y="170" text-anchor="middle" font-size="18" style="fill:#696D7C">Dedicated capacity</text>
<rect x="850" y="190" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="866" y="220" font-size="20">Tenant grants</text>
<rect x="850" y="248" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="866" y="278" font-size="20">Projects</text>
<rect x="850" y="306" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="866" y="336" font-size="20">Clusters</text>
<rect x="850" y="364" width="242" height="46" rx="8" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="866" y="394" font-size="20">Private nodes</text>
<line x1="314" y1="267.0" x2="425" y2="267.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#nb-arrow)"/>
<text x="369.5" y="253.0" text-anchor="middle" font-size="18">Read-only</text>
<line x1="715" y1="267.0" x2="826" y2="267.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#nb-arrow)"/>
<text x="770.5" y="253.0" text-anchor="middle" font-size="18">Capacity</text>
