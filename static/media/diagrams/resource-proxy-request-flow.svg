<svg viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Resource proxy request flow from callers through the client API server and resource proxy to custom resource objects in a target tenant cluster">
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="resource-proxy-flow-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#050B24"/>
    </marker>
    <marker id="resource-proxy-flow-arrow-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#828592"/>
    </marker>
  </defs>

  <rect width="1100" height="460" fill="#FFFFFF"/>
  <rect x="30" y="30" width="1040" height="400" rx="12" fill="#F8F9FB" stroke="#E6E7E9" stroke-width="1.5"/>
  <text x="52" y="60" font-size="14" font-weight="600" fill="#505466">vCluster Platform network</text>

  <rect x="60" y="86" width="490" height="310" rx="12" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.3"/>
  <text x="84" y="116" font-size="15" font-weight="600" fill="#050B24">Client tenant cluster</text>
  <text x="84" y="137" font-size="14" fill="#828592">The aggregation layer routes configured API groups to a local proxy</text>

  <rect x="82" y="174" width="130" height="58" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="147" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">kubectl</text>
  <text x="147" y="217" text-anchor="middle" font-size="14" fill="#828592">interactive caller</text>

  <rect x="82" y="272" width="130" height="58" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="147" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">Workload</text>
  <text x="147" y="315" text-anchor="middle" font-size="14" fill="#828592">controller or client</text>

  <rect x="246" y="207" width="144" height="90" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="318" y="235" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">Client API server</text>
  <text x="318" y="257" text-anchor="middle" font-size="14" fill="#828592">aggregation layer</text>
  <text x="318" y="276" text-anchor="middle" font-size="14" fill="#828592">matches APIService</text>

  <rect x="414" y="197" width="116" height="110" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="472" y="226" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">Resource proxy</text>
  <text x="472" y="248" text-anchor="middle" font-size="14" fill="#828592">labels and filters</text>
  <text x="472" y="266" text-anchor="middle" font-size="14" fill="#828592">resource requests</text>
  <text x="472" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#FF6600">example.com/v1</text>

  <rect x="610" y="86" width="430" height="310" rx="12" fill="#FFFFFF" stroke="#326CE3" stroke-width="1.3"/>
  <text x="634" y="116" font-size="15" font-weight="600" fill="#050B24">Target tenant cluster</text>
  <text x="634" y="137" font-size="14" fill="#828592">Stores custom resource objects; controllers are optional</text>

  <rect x="640" y="207" width="140" height="90" rx="8" fill="#FFF7F2" stroke="#FF6600" stroke-width="1.8"/>
  <text x="710" y="240" text-anchor="middle" font-size="14" font-weight="650" fill="#050B24">Target API</text>
  <text x="710" y="262" text-anchor="middle" font-size="14" fill="#828592">authenticates client</text>
  <text x="710" y="280" text-anchor="middle" font-size="14" fill="#828592">Platform identity</text>

  <rect x="808" y="174" width="190" height="78" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="903" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">MyResource objects</text>
  <text x="903" y="223" text-anchor="middle" font-size="14" fill="#828592">example.com/v1 API</text>
  <text x="903" y="240" text-anchor="middle" font-size="14" fill="#828592">owner labels when injected</text>

  <rect x="808" y="290" width="190" height="62" rx="8" fill="#F3F5F9" stroke="#B4B6BD" stroke-width="1.2"/>
  <text x="903" y="316" text-anchor="middle" font-size="14" font-weight="600" fill="#050B24">Optional controller</text>
  <text x="903" y="336" text-anchor="middle" font-size="14" fill="#828592">reconciles MyResource</text>

  <path d="M212 203 H226 Q238 203 246 218" fill="none" stroke="#828592" stroke-width="1.5" marker-end="url(#resource-proxy-flow-arrow-muted)"/>
  <path d="M212 301 H226 Q238 301 246 286" fill="none" stroke="#828592" stroke-width="1.5" marker-end="url(#resource-proxy-flow-arrow-muted)"/>

  <line x1="390" y1="252" x2="412" y2="252" stroke="#050B24" stroke-width="1.6" marker-end="url(#resource-proxy-flow-arrow)"/>

  <line x1="530" y1="252" x2="638" y2="252" stroke="#050B24" stroke-width="1.8" marker-end="url(#resource-proxy-flow-arrow)"/>
  <rect x="554" y="260" width="52" height="20" rx="10" fill="#FFFFFF"/>
  <text x="580" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#505466">tsnet</text>

  <line x1="780" y1="230" x2="806" y2="215" stroke="#050B24" stroke-width="1.5" marker-end="url(#resource-proxy-flow-arrow)"/>
  <path d="M830 290 V270 H780" fill="none" stroke="#828592" stroke-width="1.4" marker-end="url(#resource-proxy-flow-arrow-muted)"/>
  <rect x="840" y="260" width="96" height="20" rx="10" fill="#FFFFFF"/>
  <text x="888" y="274" text-anchor="middle" font-size="14" fill="#828592">reads and writes</text>
</svg>
