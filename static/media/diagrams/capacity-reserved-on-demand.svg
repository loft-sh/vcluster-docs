<svg viewBox="0 0 764 494" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A vMetal machine inventory split into three pools: machines reserved for Tenant A, unassigned machines, and machines reserved for Tenant B. Requests from Tenant A draw from its reserved machines under either policy, and from unassigned machines only under the on-demand policy. Tenant B's machines are never used for Tenant A. The machines Tenant A gets join its cluster as private nodes. Beside the cluster, a node type quota caps how many instances Tenant A holds across its projects, and reserves no machines.">
  <defs>
    <style><![CDATA[
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    ]]></style>
    <marker id="capacity-pool-arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#B4B6BD"/>
    </marker>
  </defs>
<rect x="0" y="0" width="764" height="494" fill="#FFFFFF"/>
<rect x="28.0" y="28.0" width="708.0" height="188.0" rx="14" fill="#E6F8FB" stroke="#00B7D6" stroke-width="2"/>
<text x="48.0" y="56.0" font-size="16" font-weight="600" fill="#050B24">vMetal machine inventory</text>
<rect x="48.0" y="76.0" width="212.0" height="94.0" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="64.0" y="102.0" font-size="14" font-weight="600" fill="#050B24">Reserved for Tenant A</text>
<rect x="64.0" y="118.0" width="84.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="106.0" y="141.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Machine</text>
<rect x="160.0" y="118.0" width="84.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="202.0" y="141.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Machine</text>
<rect x="276.0" y="76.0" width="212.0" height="94.0" rx="10" fill="#EDEFF3" stroke="#B4B6BD" stroke-width="2"/>
<text x="292.0" y="102.0" font-size="14" font-weight="600" fill="#050B24">Unassigned</text>
<rect x="292.0" y="118.0" width="84.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="334.0" y="141.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Machine</text>
<rect x="388.0" y="118.0" width="84.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="430.0" y="141.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Machine</text>
<rect x="504.0" y="76.0" width="212.0" height="94.0" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="520.0" y="102.0" font-size="14" font-weight="600" fill="#050B24">Reserved for Tenant B</text>
<rect x="520.0" y="118.0" width="84.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="562.0" y="141.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Machine</text>
<rect x="616.0" y="118.0" width="84.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="658.0" y="141.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Machine</text>
<text x="610.0" y="194.0" font-size="14" font-weight="400" fill="#696D7C" text-anchor="middle">Never used for Tenant A</text>
<line x1="154.0" y1="220.0" x2="154.0" y2="300.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#capacity-pool-arrow)"/>
<line x1="382.0" y1="220.0" x2="382.0" y2="300.0" stroke="#B4B6BD" stroke-width="1.5" marker-end="url(#capacity-pool-arrow)"/>
<text x="144.0" y="264.0" font-size="14" font-weight="400" fill="#050B24" text-anchor="end">Both policies</text>
<text x="392.0" y="264.0" font-size="14" font-weight="400" fill="#050B24">On demand only</text>
<rect x="28.0" y="304.0" width="480.0" height="162.0" rx="14" fill="#EAF0FC" stroke="#326CE3" stroke-width="2"/>
<text x="48.0" y="332.0" font-size="16" font-weight="600" fill="#050B24">Tenant A cluster</text>
<rect x="48.0" y="352.0" width="440.0" height="94.0" rx="10" fill="#FFFFFF" stroke="#33c7a0" stroke-width="1.5" stroke-dasharray="6,4"/>
