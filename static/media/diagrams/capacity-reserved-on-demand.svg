<text x="119.5" y="417.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Private node</text>
<rect x="187.0" y="394.0" width="111.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="242.5" y="417.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Private node</text>
<rect x="310.0" y="394.0" width="111.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5"/>
<text x="365.5" y="417.0" font-size="14" font-weight="400" fill="#828592" text-anchor="middle">Private node</text>
<rect x="524.0" y="304.0" width="212.0" height="162.0" rx="10" fill="#FFFFFF" stroke="#B4B6BD" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="540.0" y="332.0" font-size="14" font-weight="600" fill="#050B24">Node type quota</text>
<text x="540.0" y="358.0" font-size="14" font-weight="400" fill="#828592">Caps how many instances</text>
<text x="540.0" y="378.0" font-size="14" font-weight="400" fill="#828592">of each node type</text>
<text x="540.0" y="398.0" font-size="14" font-weight="400" fill="#828592">Tenant A holds across</text>
<text x="540.0" y="418.0" font-size="14" font-weight="400" fill="#828592">its projects. It reserves</text>
<text x="540.0" y="438.0" font-size="14" font-weight="400" fill="#828592">no machines.</text>
</svg>
