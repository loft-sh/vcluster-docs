[build]
base = "/"
publish = "public/"
command = """
    set -e
    echo "NODE_OPTIONS: $NODE_OPTIONS"
    node --version
    node -e "console.log('Heap limit:', require('v8').getHeapStatistics().heap_size_limit / 1024 / 1024 / 1024, 'GB')"
    mkdir -p public/
    npm run build
    mv build/ public/docs/
  """

[build.environment]
  NODE_VERSION = "24"
  NODE_OPTIONS = "--max-old-space-size=8192"

[build.processing]
  skip = false

[build.processing.html]
  pretty_urls = true

# Redirects - Order matters (first match wins)
# Specific paths before wildcards, /next/ stays in /next/

# DOC-1261: old static llm.txt replaced by auto-generated llms.txt
[[redirects]]
  from = "/docs/llm.txt"
  to = "/docs/llms.txt"
  status = 301

